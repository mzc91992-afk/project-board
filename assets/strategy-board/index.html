<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="renderer" content="webkit">
<meta name="force-rendering" content="webkit">
<!-- IE / 老 Trident 内核兜底：这类内核读不懂现代 JS，页面会白屏。
     用纯 ES5 提前拦住，给出可读提示和网址，而不是一片空白。 -->
<script>
(function(){
  var ua = navigator.userAgent || "";
  var oldIE = /\bMSIE [5-9]\./.test(ua) || /Trident\/[4-9]\./.test(ua) || /Edge\/1[2-8]\./.test(ua);
  if (!oldIE) return;
  var url = location.href;
  var css = ".oldie #loginView,.oldie #appView{display:none!important}" +
    ".oldieTip{position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;background:#f6f7f9;padding:32px 20px;box-sizing:border-box;overflow:auto}" +
    ".oldieTip .card{max-width:520px;margin:40px auto;background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:26px 24px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:left}" +
    ".oldieTip h2{margin:0 0 12px;font-size:18px;color:#1f2430;font-weight:700}" +
    ".oldieTip p{margin:0 0 12px;font-size:14px;line-height:1.75;color:#4a5361}" +
    ".oldieTip input{width:100%;box-sizing:border-box;height:36px;padding:0 10px;border:1px solid #d7dbe0;border-radius:6px;font-size:13px;color:#1f2430;background:#fafbfc}";
  document.write("<style>" + css + "</style>");
  var html = document.documentElement;
  html.className = (html.className ? html.className + " " : "") + "oldie";
  document.write(
    '<div class="oldieTip"><div class="card">' +
    '<h2>请用新版浏览器打开</h2>' +
    '<p>当前浏览器正在用老旧的 IE 内核渲染，本页面的技术无法在上面运行。</p>' +
    '<p>三种办法任选其一：<br>1. 换成 Edge、Chrome 或 360 浏览器；<br>' +
    '2. 如果用的是 360 / 搜狗 / QQ 浏览器，点地址栏右侧的「闪电 / 极速模式」图标，从「兼容模式」切到「极速模式」即可；<br>' +
    '3. 复制下面的网址，粘贴到浏览器地址栏打开。</p>' +
    '<input id="oldieUrl" readonly value="' + url + '">' +
    '</div></div>'
  );
})();
</script>

</script>
<style>
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f8fafc; --line:#e3e8ef; --line-2:#eef2f7;
  --text:#111827; --text-2:#5b6472; --text-3:#8b95a5;
  --accent:#c01e28; --accent-soft:#faeeef; --accent-line:#c01e28;
  --red:#b42318; --red-soft:#fee4e2; --amber:#b54708; --amber-soft:#fef0c7;
  --green:#067647; --green-soft:#dcfae6; --blue:#1d5fa6; --blue-soft:#e2eef9;
  --gray-soft:#eef1f5;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
}
[data-theme="dark"]{
  --bg:#0d1117; --surface:#161b22; --surface-2:#11161d; --line:#262d38; --line-2:#1e242e;
  --text:#e6edf3; --text-2:#9aa6b6; --text-3:#6b7787;
  --accent:#f2707a; --accent-soft:#3a1d20; --accent-line:#f2707a;
  --red:#f97066; --red-soft:#3a1d1b; --amber:#f0b429; --amber-soft:#3a2c10;
  --green:#4ade80; --green-soft:#12301f; --blue:#6ba6ff; --blue-soft:#16273f;
  --gray-soft:#1e242e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  /* 微信内置浏览器会按用户的字体设置整体放大，布局会散 —— 锁死 */
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer}
.hide{display:none !important}

/* ---------- shell ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 64px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.3px}
.brand span{font-size:12px;color:var(--text-3)}
.spacer{flex:1}
.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--text);
  padding:7px 13px;border-radius:8px;font-size:13px;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--accent-line);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.primary{color:#06231f}
.btn.primary:hover{opacity:.88;color:#fff}
[data-theme="dark"] .btn.primary:hover{color:#06231f}
.btn.danger{color:var(--red);border-color:var(--line)}
.btn.danger:hover{border-color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.sync{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:var(--text-3)}
.dot.busy{background:var(--amber)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--text-3);margin-bottom:4px}
.stat .v{font-size:22px;font-weight:600;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--text-3);margin-top:2px}
.stat.warn .v{color:var(--amber)}
.stat.alert .v{color:var(--red)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:13px;color:var(--text-2)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.field{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 11px;
  font-size:13px;min-width:0;
}
select.field,input.field{height:34px}
/* 密码可见切换（2026-11-02b）：输入框右侧内置按钮，点一下明文/密文互换 */
.pwdwrap{position:relative;display:block}
.pwdwrap input.field{width:100%;padding-right:58px}
.pwdtog{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:4px;
  border:0;background:transparent;color:var(--text-3);font-size:11.5px;line-height:1;padding:5px 7px;border-radius:7px;cursor:pointer}
.pwdtog:hover{background:var(--surface-2);color:var(--accent)}
.pwdtog:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pwdtog svg{width:14px;height:14px;display:block;stroke:currentColor;fill:none;stroke-width:1.6}
.switch{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 11px;height:34px}
.switch input{accent-color:var(--accent);margin:0}
input[type=checkbox]{width:15px;height:15px}

/* ---------- board ---------- */
.group{margin-bottom:24px}
.group-h{display:flex;align-items:center;gap:10px;margin:0 0 11px}
.group-h h2{font-size:14px;font-weight:600;margin:0}
.group-h .cnt{font-size:12px;color:var(--text-3)}
.group-h .rule{flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px 12px;
  box-shadow:var(--shadow);cursor:pointer;transition:.16s;position:relative;overflow:hidden;
}
.card:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.card.stale{border-left:3px solid var(--amber)}
.card.closed{opacity:.62}
.card-top{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.card h3{margin:0;font-size:15px;font-weight:600;flex:1;min-width:0;line-height:1.45}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap;flex:none;font-weight:500}
.t-short{background:var(--red-soft);color:var(--red)}
.t-mid{background:var(--blue-soft);color:var(--blue)}
.t-long{background:var(--green-soft);color:var(--green)}
.t-custom{background:var(--gray-soft);color:var(--text-2)}
.t-paused{background:var(--gray-soft);color:var(--text-2)}
.t-closed{background:var(--gray-soft);color:var(--text-3)}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:9px}
.meta b{font-weight:500;color:var(--text)}
.pill{background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;font-size:12px}
.scoreline{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.bar{flex:1;min-width:96px;height:6px;border-radius:20px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:20px;background:var(--accent)}
.summary{
  font-size:13px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:8px;padding:8px 10px;margin-bottom:9px;
}
.next{font-size:12.5px;color:var(--text-2);margin-bottom:10px}
.next b{color:var(--amber);font-weight:500}
.card-foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);
  border-top:1px solid var(--line-2);padding-top:8px}
.stale-flag{color:var(--amber);font-weight:500}
/* 卡片右下角直接删除，不用进抽屉 */
.card-del{margin-left:auto;flex:none;border:1px solid var(--line);background:transparent;color:var(--text-3);
  border-radius:6px;font-size:11.5px;padding:2px 8px}
.card-del:hover{color:var(--red);border-color:var(--red)}
/* 多行文本（下一步 / 状态 / 简介）原样显示，换行不丢 */
.card .summary,.next,.statusline,.rel-line{white-space:pre-wrap}
.rel-line{font-size:12.5px;color:var(--text-2);margin-bottom:9px}
.rel-line b{color:var(--accent);font-weight:500}

/* ---------- quadrant（四格拖放版） ---------- */
.qwrap{background:transparent}
.qhint{font-size:12px;color:var(--text-2);margin-bottom:10px}
.qhint b{color:var(--accent);font-weight:500}
.qmsg{font-size:12px;color:var(--green);min-height:17px;margin-bottom:6px}
.qmsg.err{color:var(--red)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qcell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;
  box-shadow:var(--shadow);min-height:132px;transition:border-color .15s,box-shadow .15s}
/* 拖动经过时整格高亮，让人确认"我要放进这一格" */
.qcell.over{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft) inset}
.qch{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.qch h4{margin:0;font-size:13px;font-weight:600}
.qch .cnt{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.qcd{font-size:11.5px;color:var(--text-3);margin-bottom:9px}
.qc-hi .qch h4{color:var(--red)}
.qc-plan .qch h4{color:var(--accent)}
.qc-watch .qch h4{color:var(--amber)}
.qc-hold .qch h4{color:var(--text-3)}
.qcard{font-size:13px;padding:6px 9px;border-radius:7px;background:var(--surface-2);
  border:1px solid var(--line-2);margin-bottom:6px;cursor:grab;
  touch-action:none;-webkit-user-select:none;user-select:none;transition:border-color .15s}
.qcard:hover{border-color:var(--accent-line)}
.qcard small{display:block;color:var(--text-3);font-size:11.5px}
.qcard.dragging{opacity:.35;border-style:dashed}
.qcard.notactive{border-style:dashed;opacity:.75}
.qdrop{min-height:40px;border:1px dashed transparent;border-radius:8px}
.qcell.over .qdrop{border-color:var(--accent-line)}
.qnone{font-size:12px;color:var(--text-3);padding:8px 2px}
/* 跟手的影子：pointer-events 必须关掉，否则 elementFromPoint 每次都命中影子自己 */
.qghost{position:fixed;z-index:9999;pointer-events:none;max-width:280px;background:var(--surface);
  border:1px solid var(--accent-line);border-radius:7px;padding:6px 9px;font-size:13px;
  box-shadow:0 8px 22px rgba(16,24,40,.2);opacity:.96}
.qghost small{display:block;color:var(--text-3);font-size:11.5px}

/* ---------- 在线成员 ---------- */
.online{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 11px;
  height:34px;cursor:pointer;position:relative;max-width:340px}
.online .onames{color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.online b{font-weight:600}
.opanel{position:absolute;right:0;top:38px;z-index:60;min-width:260px;max-height:min(72vh,560px);overflow-y:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(16,24,40,.16);padding:10px 12px}
.op-head{font-size:12px;color:var(--text-3);margin-bottom:7px}
.orow{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0}
.orow .otime{margin-left:auto;font-size:11.5px;color:var(--text-3)}
.ome{font-size:11.5px;color:var(--accent)}
.op-foot{margin-top:9px;padding-top:9px;border-top:1px solid var(--line-2);display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--text-3);flex-wrap:wrap}
.op-foot input{width:96px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--surface-2);font-size:12px}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow);font-size:13px}
.tbl th{text-align:left;padding:10px 12px;font-size:12px;color:var(--text-3);font-weight:500;
  border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.empty{text-align:center;padding:56px 20px;color:var(--text-3);background:var(--surface);
  border:1px dashed var(--line);border-radius:12px}
.empty p{margin:0 0 14px}

/* ---------- modal / drawer ---------- */
.mask{position:fixed;inset:0;width:100%;height:100%;background:rgba(9,14,22,.5);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:100%;max-width:520px;height:100%;overflow-y:auto;
  box-shadow:-8px 0 30px rgba(0,0,0,.14);display:flex;flex-direction:column}
.drawer header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:15px 18px;display:flex;align-items:flex-start;gap:10px;z-index:2}
.drawer header h2{margin:0;font-size:16px;font-weight:600;flex:1}
.drawer .body{padding:16px 18px 30px}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:28px;height:28px;
  font-size:16px;line-height:1;color:var(--text-2);flex:none}
.xbtn:hover{color:var(--red);border-color:var(--red)}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:12px;color:var(--text-3);margin-bottom:5px}
.frow input,.frow select,.frow textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface-2);outline:none;
}
.frow textarea{min-height:74px;resize:vertical;line-height:1.55}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--accent-line)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.timeline{margin-top:6px}
.tl-item{border-left:2px solid var(--line);padding:0 0 14px 14px;margin-left:4px;position:relative}
.tl-item::before{content:"";position:absolute;left:-5px;top:6px;width:8px;height:8px;border-radius:50%;
  background:var(--accent);border:2px solid var(--surface)}
.tl-time{font-size:11.5px;color:var(--text-3);margin-bottom:2px}
.tl-body{font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.tl-who{font-size:11.5px;color:var(--text-3);margin-top:3px}
.tl-item.note{border-left-color:var(--amber)}
.tl-item.note::before{background:var(--amber)}
.tl-item.coord-no{border-left-color:var(--red)}
.tl-item.coord-no::before{background:var(--red)}
.tl-item.coord-ok{border-left-color:var(--green)}
.tl-item.coord-ok::before{background:var(--green)}
.tl-item.cur::before{background:var(--green)}
.coord-toggle{min-width:66px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;border:1px solid;cursor:pointer;flex:none}
.coord-toggle.ok{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.coord-toggle.no{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.coord-toggle:hover{opacity:.85}
.tl-act{display:flex;gap:12px;margin-top:5px;font-size:11.5px}
.tl-act button{background:none;border:none;padding:0;color:var(--accent);font-size:11.5px;cursor:pointer}
.tl-act button.del{color:var(--red)}
.tl-act button.subst-on{color:#16a34a;font-weight:600}
.tl-act button:hover{text-decoration:underline}
/* 时间线就地编辑：点「编辑」后原文变输入框，改完保存，时间线上留个「已编辑」标记 */
.tl-edit{margin-top:7px}
.tl-edit textarea{
  width:100%;min-height:66px;resize:both;max-width:100%;padding:8px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface-2);outline:none;
  font-size:13px;line-height:1.55;color:var(--text);font-family:inherit;
}
.tl-edit textarea:focus{border-color:var(--accent-line)}
.tl-edit .lbl{font-size:11.5px;color:var(--text-3);margin:8px 0 0}
.tl-edit .row{margin-top:8px}
.tl-edited{color:var(--text-3)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hzrow{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.hzrow input{flex:1}
.hzrow .btn{flex:none}
.badge-note{background:var(--amber-soft);color:var(--amber);border-radius:20px;padding:1px 7px;font-size:11px;font-weight:500}
/* 人名多选 chips（负责人 / 批注人） */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{cursor:pointer;margin:0}
.chip input{display:none}
.chip span{display:inline-block;padding:4px 12px;border:1px solid var(--line);border-radius:16px;
  font-size:12.5px;color:var(--text-2);background:var(--surface);transition:all .15s}
.chip input:checked+span{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
/* 抽屉内文本框允许纵横双向拖拉，松手后记住尺寸 */
.drawer textarea{resize:both;max-width:100%}
.ta-reset{display:inline-block;margin-top:4px;font-size:12px;color:var(--text-3);cursor:pointer;text-decoration:underline}
.ta-reset:hover{color:var(--accent)}
/* 人名 chip 的删除 × 与添加 */
.chip{position:relative;padding-right:0}
/* 16q：chip 拖动已取消，恢复普通点击样式（勾选=选中、×=删除） */
.chips .chip:not(.add):not(.addinp){cursor:pointer}
.chip .chipx{margin-left:5px;font-style:normal;font-size:13px;line-height:1;color:var(--text-3);padding:0 2px}
.chip .chipx:hover{color:var(--red)}
/* 「＋ 添加」与人名的 chip 用同一副样子：同样的圆角、内边距、字号，只是边框是虚线 */
.chip.add,.chip.addinp{
  display:inline-block;padding:4px 12px;border:1px solid var(--line);border-radius:16px;
  font-size:12.5px;line-height:1.6;background:var(--surface);color:var(--text-2);transition:all .15s;
}
.chip.add:hover{border-color:var(--accent-line);color:var(--accent)}
/* 点「＋ 添加」后就地变成输入框，外形仍与人名一致 */
.chip.addinp{
  width:112px;border-color:var(--accent-line);color:var(--text);outline:none;
}
.statusline{font-size:13px;color:var(--blue);margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.statusline b{font-weight:500}
.sect{font-size:12px;color:var(--text-3);margin:20px 0 9px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.alertbox{background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);
  border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.okbox{background:var(--green-soft);border:1px solid var(--green);color:var(--green);
  border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.errbox{background:var(--red-soft);border:1px solid var(--red);color:var(--red);
  border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:14px}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 30px;
  width:100%;max-width:390px;box-shadow:var(--shadow)}
.lbox h1{margin:0 0 6px;font-size:20px;font-weight:600}
.lbox .sub{color:var(--text-3);font-size:13px;margin:0 0 24px}
.step{display:flex;gap:8px;margin-bottom:18px}
.step i{flex:1;height:3px;border-radius:3px;background:var(--gray-soft)}
.step i.on{background:var(--accent)}
.login .frow{margin-bottom:14px}
.login .btn{width:100%;padding:10px}
.linkbtn{background:none;border:0;color:var(--accent);font-size:12.5px;padding:0}
.countdown{font-size:12px;color:var(--text-3);margin-top:8px;text-align:center}

/* 明细表 12 列在手机上会挤成一团，给它一个可横滑的容器 */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.tblwrap .tbl{min-width:900px}

@media(max-width:720px){
  .wrap{padding:14px 13px 60px}
  .quad{grid-template-columns:1fr}
  .f2{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .tbl{font-size:12px}
  .brand h1{font-size:17px}
  /* 手机端触控目标放大，避免点不中 */
  .seg button{padding:8px 13px;font-size:13.5px}
  .btn{min-height:44px}
  .login .btn{height:auto;min-height:46px}
  .lbox{padding:22px 18px;border-radius:14px}
  .toolbar{gap:8px}
  .drawer{max-width:none}
  .stat .v{font-size:22px}
}
@media(max-width:480px){
  .online{max-width:none;font-size:12px}
  .opanel{position:fixed;right:12px;left:12px;top:52px;min-width:0}
}
/* 记住登录 30 天 */
.remember{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);
  margin:0 0 14px;cursor:pointer;user-select:none}
.remember input{width:15px;height:15px;accent-color:var(--accent);flex:none}
/* fatal banner */
#fatalHost{position:fixed;left:0;right:0;top:0;z-index:200}
.fatalbar{background:var(--red-soft);border-bottom:1px solid var(--red);color:var(--red);
  padding:10px 16px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fatalbar b{flex:none}
.fatalbar span{flex:1;min-width:180px;word-break:break-word;color:var(--text)}
/* 新版本提示条 */
.updatebar{position:fixed;left:0;right:0;bottom:0;z-index:190;background:var(--surface);
  border-top:1px solid var(--line);padding:10px 16px;font-size:12.5px;
  display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.warnbar{background:var(--amber-soft,var(--surface));border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:12.5px;line-height:1.6;margin:0 0 12px;color:var(--text)}
.warnbar b{display:block;margin-bottom:4px}
.warnbar .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
/* ---------- 附件 ---------- */
.filebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
/* 上传用的 file input：不能用 display:none —— 那样部分手机浏览器点按钮唤不起文件选择框。
   改成「看不见但仍能被程序点击」的写法 */
.file-hide{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;border:0!important;opacity:0!important}
/* 上传按钮：原生 file input 透明地铺在按钮上，用户点到的就是 input 本身，最稳妥 */
.pickwrap{position:relative;display:inline-flex;vertical-align:middle}
.pickwrap .file-cover{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;border:0;padding:0;margin:0;background:transparent}
.pickwrap .btn:disabled ~ .file-cover{pointer-events:none}
.upbox{margin:6px 0 2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.upbox.hide{display:none}
.uptop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--text-2);margin-bottom:7px}
.upname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%}
.uppct{flex:none;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.upbar{height:9px;border-radius:999px;background:var(--gray-soft);overflow:hidden}
.upbar>i{display:block;height:100%;width:0%;border-radius:999px;background:var(--accent);transition:width .2s linear}
.uphint{margin-top:6px;font-size:11.5px;color:var(--text-3)}
.filebox .hint,.filelist .hint{font-size:12px;color:var(--text-3)}
.filelist{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.filelist:empty{display:none}
.fitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.fitem:last-child{border-bottom:none}
.fitem .ficon{flex:none;font-size:15px}
.fitem .fname{flex:1;min-width:80px;word-break:break-all;color:var(--text)}
.fitem .fmeta{flex:none;font-size:11.5px;color:var(--text-3)}
.fitem .fact{flex:none;display:flex;gap:10px}
.fitem .fact button{background:none;border:none;padding:0;font-size:12px;color:var(--accent);cursor:pointer}
.fitem .fact button.del{color:var(--red)}
.fitem .fact button:hover{text-decoration:underline}
.badge-file{background:var(--accent-soft,#eef2ff);color:var(--accent);border-radius:10px;padding:1px 7px;font-size:11px}
/* 附件预览弹层：位置尺寸由 JS 给出（left/top/width/height），可最大化/最小化/关闭，四边四角都能拖（16z） */
.pvbox{position:fixed;z-index:210;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.pvbox.pv-max{left:8px!important;top:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 16px)!important;border-radius:10px}
.pvbox.pv-min{left:auto!important;top:auto!important;right:14px;bottom:14px;width:auto!important;height:auto!important;min-width:200px;max-width:78vw}
.pvbox.pv-min .pvhead,.pvbox.pv-min .pvbody,.pvbox.pv-min .pvfoot,.pvbox.pv-min .pvhs{display:none}
.pvminbar{display:none;align-items:center;gap:10px;padding:9px 12px;font-size:12.5px;pointer-events:auto}
.pvbox.pv-min .pvminbar{display:flex}
.pvminbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvminbar button{flex:none;background:none;border:none;padding:0;font-size:12px;color:var(--accent);cursor:pointer}
.mask.no-bg{background:transparent;pointer-events:none}
.pvhead{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line-2);font-size:13px}
.pvhead b{flex:1;min-width:0;word-break:break-all}
.pvhead span{flex:none;font-size:11.5px;color:var(--text-3)}
.pvbtn{flex:none;background:none;border:none;padding:3px 7px;font-size:12px;line-height:1.2;color:var(--text-3);cursor:pointer;border-radius:6px}
.pvbtn:hover{background:var(--surface-2);color:var(--text)}
#pvClose{font-size:16px;padding:2px 8px}
.pvbody{flex:1;background:var(--bg,#f6f7f9);overflow:auto;display:flex;align-items:center;justify-content:center;position:relative}
.pvbody img{max-width:100%;max-height:100%;object-fit:contain}
.pvbody iframe{width:100%;height:100%;border:none;background:#fff}
.pvfail{padding:16px;font-size:12.5px;color:var(--text-3);text-align:center}
.pvload{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12.5px;color:var(--text-3)}
.pvload i{width:26px;height:26px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:pvspin .8s linear infinite}
@keyframes pvspin{to{transform:rotate(360deg)}}
.pvload .slow{font-size:11.5px}
.pvtip{padding:10px 14px;font-size:11.5px;color:var(--text-3);text-align:center;border-top:1px dashed var(--line-2)}
.tbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:210;width:min(640px,92vw);max-height:78vh;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.thead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:13.5px}
.thead b{flex:1}
.tbody{overflow:auto;padding:4px 14px}
.titem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.titem .tn{flex:1;min-width:0}
.titem .tn b{display:block;font-size:13px;word-break:break-all}
.titem .tn span{font-size:11.5px;color:var(--text-3)}
.tfoot{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line-2)}
.pvfoot{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line-2);font-size:12.5px}
.pvfoot a{color:var(--accent);text-decoration:none}
/* 预览窗口大小：四边 + 四角都能拖，双击右下角恢复默认，尺寸位置记在本机（16z） */
.pvhs{position:absolute;z-index:5;touch-action:none}
.pvhs.n{left:12px;right:12px;top:0;height:7px;cursor:ns-resize}
.pvhs.s{left:12px;right:12px;bottom:0;height:7px;cursor:ns-resize}
.pvhs.w{top:12px;bottom:12px;left:0;width:7px;cursor:ew-resize}
.pvhs.e{top:12px;bottom:12px;right:0;width:7px;cursor:ew-resize}
.pvhs.nw{left:0;top:0;width:15px;height:15px;cursor:nwse-resize}
.pvhs.ne{right:0;top:0;width:15px;height:15px;cursor:nesw-resize}
.pvhs.sw{left:0;bottom:0;width:15px;height:15px;cursor:nesw-resize}
.pvhs.se{right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize}
.pvrs{touch-action:none;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 0 40%,var(--line-2) 40% 48%,transparent 48% 56%,var(--line-2) 56% 64%,transparent 64%);
  border-bottom-right-radius:12px}
.pvrs:hover{background:linear-gradient(135deg,transparent 0 40%,var(--accent) 40% 48%,transparent 48% 56%,var(--accent) 56% 64%,transparent 64%)}
body.m-mode .pvhs.n,body.m-mode .pvhs.s{height:12px}
body.m-mode .pvhs.w,body.m-mode .pvhs.e{width:12px}
body.m-mode .pvhs.nw,body.m-mode .pvhs.ne,body.m-mode .pvhs.sw{width:24px;height:24px}
.pvfoot .hint{font-size:11.5px;color:var(--text-3);margin-left:auto}
/* 只读页附件：文件名本身可点开预览 */
.fname.flink{cursor:pointer;color:var(--accent)}
.fname.flink:hover{text-decoration:underline}
.dhint{font-weight:400;font-size:11.5px;color:var(--text-3)}
body.m-mode .pvrs{width:34px;height:34px}
  /* iOS 上字号小于 16px 的输入框聚焦时会自动放大页面 */
  @media(max-width:720px){
    input.field, textarea, select { font-size:16px; }
  }
/* ---------- 分类导航（首页默认视图） ---------- */
.cat-week{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 2px 14px;font-size:13.5px;font-weight:500;color:var(--text)}
.cat-week span{font-weight:400;color:var(--text-3);font-size:12px}
.cat-group{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.cat-h{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.cat-h h2{font-size:14px;font-weight:600;margin:0}
.cat-h .cnt{font-size:12px;color:var(--text-3)}
.cat-ico{width:10px;height:10px;border-radius:3px;flex:none}
.cat-plus{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);border-radius:8px;width:26px;height:26px;font-size:14px;line-height:1;cursor:pointer;flex:none}
.cat-plus:hover{color:var(--accent);border-color:var(--accent)}
.cat-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-top:1px solid var(--line-2);cursor:pointer}
.cat-row:hover{background:var(--surface-2)}
.cat-row .cat-bar{width:3px;height:16px;border-radius:2px;flex:none}
.cat-row .cat-name{font-size:13.5px;font-weight:500;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row.stale .cat-name{color:var(--text-3)}
.badge-new{background:var(--red-soft);color:var(--red);border-radius:4px;padding:0 5px;font-size:10.5px;font-weight:600;letter-spacing:.5px;flex:none}
.cat-star{color:var(--amber);font-size:12px;flex:none}
.cat-tag{border-radius:4px;padding:0 5px;font-size:10.5px;flex:none}
.cat-tag.t-paused{background:var(--gray-soft);color:var(--text-2)}
.cat-tag.t-closed{background:var(--gray-soft);color:var(--text-3)}
.cat-row .cat-stage{flex:none}
.cat-row .cat-meta{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap}
.cat-row .chev{color:var(--text-3);font-size:15px;flex:none}
.cat-add{width:100%;margin-top:8px;border:1px dashed var(--line);background:none;color:var(--text-3);border-radius:8px;padding:6px;font-size:12px;cursor:pointer}
.cat-add:hover{color:var(--accent);border-color:var(--accent)}
.cat-owners table{width:100%;border-collapse:collapse;font-size:12.5px}
.cat-owners th{text-align:left;font-weight:500;color:var(--text-3);padding:6px 8px;border-bottom:1px solid var(--line)}
.cat-owners td{padding:7px 8px;border-bottom:1px solid var(--line-2)}
@media(max-width:640px){.cat-row .cat-stage{display:none}.cat-row .cat-name{max-width:56%}}
/* ---------- 首页：领导样例版式（三列 + 双人员表） ---------- */
/* 16r：KPI 条独占一行横向排开（不换行），每张卡右缘 kpirz 把手可拖宽窄 */
.lead-kpis{display:flex;gap:10px;flex-wrap:nowrap;margin:2px 0 10px}
.lead-kpis .kpi{flex:1 1 0;min-width:86px;max-width:100%;overflow:hidden;position:relative}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 16px;min-width:86px;text-align:center}
.kpi b{display:block;font-size:20px;line-height:1.25;color:var(--text)}
.kpi span{font-size:12px;color:var(--text-3)}
.kpi.c-upd b{color:var(--green)}
.kpi.c-new b{color:var(--red)}
.kpi.c-key b{color:var(--amber)}
/* 16q：周期切换「本周动态」卡（KPI 同款外观，放全部项目左边），‹ › 内嵌在卡内 */
.kpi.kpi-wk{cursor:default;text-align:left;min-width:132px;position:relative}
.kpi-wk b{font-size:14px}
.kpi-wk .wk-rng{display:block;font-size:11px;color:var(--text-3);margin-top:1px}
.kpi-wk .wk-btns{position:absolute;top:50%;right:8px;transform:translateY(-50%);display:flex;gap:4px}
.kpi-wk .wk-btns button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;line-height:1;color:var(--text-2);padding:0}
.kpi-wk .wk-btns button:hover{color:var(--text);border-color:var(--text-3)}
.kpi-wk .wk-rng{padding-right:52px}
/* 16r：KPI 卡右缘拖宽把手（同明细表列宽手感） */
.kpirz{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;touch-action:none;z-index:3}
.kpirz:hover,.kpirz.on{background:var(--blue);opacity:.4}
.lead-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.lead-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;min-width:0}
.lead-col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.lead-col-h{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;border-bottom:1px solid var(--line)}
.lead-col-h h2{font-size:15px;margin:0;color:var(--text)}
.lead-col-h .cnt{font-size:12px;color:var(--text-3)}
.lead-ico{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:14px;font-style:normal;flex:none}
.lead-list{min-height:120px}
.lead-row{display:flex;align-items:center;gap:7px;padding:8px 2px;border-bottom:1px solid var(--line-2);cursor:pointer;border-radius:6px}
.lead-row:last-child{border-bottom:none}
.lead-row:hover{background:var(--surface-2)}
/* 分类导航文字 pill（用户定版：不再用竖线，直接文字标注） */
.npill{font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 8px;flex:none;white-space:nowrap}
.npill.np-sales{color:#17a05c;background:rgba(23,160,92,.13)}
.npill.np-bd{color:#8b5cf6;background:rgba(139,92,246,.13)}
.dot-upd{width:8px;height:8px;border-radius:50%;background:#f2b705;flex:none}
.lead-empty{padding:16px 4px;font-size:12.5px;color:var(--text-3)}
.lead-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.lead-tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.lead-tbl-h{display:flex;align-items:center;gap:8px;padding:2px 0 8px}
.lead-tbl-h h2{font-size:15px;margin:0;color:var(--text)}
.lead-tbl-h .sub{font-size:12px;color:var(--text-3)}
.lead-tbl-h .cnt{margin-left:auto;font-size:12px;color:var(--text-3)}
.lead-tbl table{width:100%;border-collapse:collapse;font-size:12.5px}
.lead-tbl th{font-weight:500;color:var(--text-3);text-align:left;padding:3px;border-bottom:1px solid var(--line);font-size:12px}
.lead-tbl th:not(:first-child),.lead-tbl td.num{text-align:center}
.lead-tbl td{padding:4px 3px;border-bottom:1px solid var(--line-2);color:var(--text-2)}
.lead-tbl tr:last-child td{border-bottom:none}
.lead-tbl td.num.on{color:var(--text);font-weight:600}
.lead-tbl td b{color:var(--text)}
.lead-note{font-size:11.5px;color:var(--text-3);text-align:right;padding:0 4px}
@media(max-width:1080px){.lead-grid{grid-template-columns:1fr}}
@media(max-width:900px){.lead-cols{grid-template-columns:1fr}}
/* ---------- 2026-10-15c：横向加宽 / 行不换行 / 拖拽改名 ---------- */
.wrap{max-width:1600px}
.lead-grid{grid-template-columns:minmax(0,2.6fr) minmax(0,1fr)}
.lead-row{flex-wrap:nowrap;overflow:hidden;touch-action:none;user-select:none;cursor:grab}
.lead-row .cat-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-col-h h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lead-tbl th,.lead-tbl td{white-space:nowrap}
.lead-col.over{outline:2px dashed var(--blue);outline-offset:-2px}
.lead-row.dragging{opacity:.35}
.lead-ghost{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.lead-ghost .lead-row{border-bottom:none}
h2.col-name{cursor:text}
h2.col-name:hover{color:var(--blue)}
.col-edit{width:100%;height:26px;border:1px solid var(--blue);border-radius:6px;padding:0 6px;background:var(--surface);color:var(--text);font-size:15px;font-weight:600;outline:none}
.lead-msg{font-size:12.5px;color:var(--accent);margin:-4px 0 8px}
.lead-msg:empty{display:none}
.lead-msg.err{color:var(--red)}
/* ---------- 2026-10-15d：品牌色细节 / 图例 / 可换行 / 详情页 / 筛选条 / 排序拖拽 ---------- */
.kpi{cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.lead-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-3);margin:0 2px 12px}
/* KPI 卡：较上周对比灰字（16l，替代原「本周动态」统计条） */
.kpi em.kpi-dl{display:block;font-style:normal;font-size:10.5px;color:var(--text-3);margin-top:1px;font-weight:400}
.kpi.c-sub b{color:var(--green)}
.kpi.c-ap b{color:#a16207}
.lead-legend .lg-sep{color:var(--line);margin:0 4px}
.lead-legend .dot-upd{display:inline-block}
.lead-row.dropbefore{box-shadow:inset 0 2px 0 var(--blue)}
.card.dropbefore{box-shadow:inset 0 2px 0 var(--blue)}
.card{cursor:grab}
.bfilter{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--blue-soft);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:13px}
.bfilter b{color:var(--text)}
.bfilter button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--text-2)}
.bfilter button:hover{color:var(--red);border-color:var(--red)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0 4px}
.dkv{display:flex;gap:8px;font-size:13px}
.dkv span{color:var(--text-3);flex:none;min-width:64px}
.dkv b{font-weight:500;color:var(--text);word-break:break-all}
.dtext{white-space:pre-wrap;font-size:13.5px;line-height:1.7;color:var(--text);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-bottom:6px;word-break:break-all}
.dnone{font-size:12.5px;color:var(--text-3);padding:6px 2px}
.dsts{padding:8px 0;border-bottom:1px solid var(--line-2)}
/* 本周更新（与导航黄点同口径）的状态动态：淡蓝底色突出，字体保持原色清晰 */
.dsts.hi{background:rgba(59,130,246,.13);border-radius:8px;padding:8px 10px;border-bottom-color:transparent;margin:2px 0}
.dsts.hi + .dsts{border-top:1px solid var(--line-2)}
.dsts .dt{font-size:12px;color:var(--text-3)}
.dsts .dc{white-space:pre-wrap;font-size:13.5px;line-height:1.6;margin:2px 0;word-break:break-all}
.dsts .dw{font-size:12px;color:var(--text-3)}
.detail-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.detail-foot{display:flex;gap:10px;padding:12px 0 4px;border-top:1px solid var(--line);margin-top:10px}
/* ---------- 2026-10-15e：BOSS 徽标 / 品牌页头 / 图例线色 ---------- */
.badge-boss{background:#fdeed2;color:#a16207;border-radius:4px;padding:0 5px;font-size:10.5px;font-weight:700;letter-spacing:.5px;flex:none}
.lg-line{display:inline-block;width:3px;height:14px;border-radius:2px;flex:none}
.lg-sales{background:#17a05c}.lg-bd{background:#8b5cf6}
/* 导航行文字允许跨行、完整显示（不截断） */
.lead-row{flex-wrap:wrap;overflow:visible}
.lead-row .cat-name{flex:1 1 auto;min-width:0;white-space:normal;overflow:visible;text-overflow:clip;max-width:none;word-break:break-word;line-height:1.35}
.brand{align-items:center}
.brand-logo{height:38px;width:auto;flex:none;display:block}
.brand-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand-txt h1{white-space:nowrap}
@media(max-width:640px){.brand-logo{height:30px}.brand-txt h1{font-size:15px;white-space:normal}}
/* ---------- 2026-10-15h：金额行 / BOSS批示框 ---------- */
/* 2026-10-16e：统一「单空格 + 竖线 + 符号」——名字按文字自然换行，竖线/符号/箭头打包成一个不拆分整体，紧跟名字末尾 */
/* 16x：下一步线索脉络（抽屉 / 详情页） */
.nl-wrap{margin:8px 0 4px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.nl-h{background:var(--surface-2);font-size:11.5px;color:var(--text-3);padding:5px 10px;border-bottom:1px solid var(--line)}
.nl-item{padding:7px 10px;border-bottom:1px solid var(--line-2)}
.nl-item:last-child{border-bottom:none}
.nl-top{display:flex;align-items:center;gap:8px}
.nl-time{font-size:11.5px;color:var(--text-3);flex:1}
.nl-btns{display:flex;gap:6px;flex:none}
.nl-txt{font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.nl-edit{font-size:12.5px}
/* 16z-3：「下一步」提交行 —— 打字不记，点提交才存进脉络 */
.nx-submit{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.nx-tip{font-size:11.5px;color:var(--text-3);flex:1;min-width:120px}
.nx-ok{font-size:11.5px;color:var(--green);white-space:nowrap}
.nx-empty{font-size:11.5px;color:var(--text-3);padding:6px 2px}
.nx-none{font-size:11.5px;color:var(--text-3);padding:6px 0 2px}
body.m-mode .nx-submit{flex-direction:column;align-items:stretch}
body.m-mode .nx-tip{flex:none}
/* 16v：「下一步」末尾的更新日期（灰字小号，不抢正文） */
.na-upd{color:var(--text-3);font-size:11px;font-weight:400;white-space:nowrap}
/* 16v：拖动排序锁按钮（解锁态高亮提示） */
#btnDragLock.unlock{border-color:var(--amber);color:var(--amber)}

/* ---------- 16v：手机版 ---------- */
.modeseg{margin-left:2px}
.modeseg button{padding:5px 10px;font-size:12px}
.mhead{margin:2px 0 10px}
.m-wk{width:100%;justify-content:space-between;cursor:default}
.m-wk .wk-btns button{width:34px;height:34px}
.mkpis{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.mtag{font-size:12px;color:var(--text-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}
/* 手机版模式下：抽屉全宽、页面收窄、工具栏可换行 */
body.m-mode .drawer{width:100%;max-width:100%}
body.m-mode .wrap{max-width:820px;padding:0 10px}
body.m-mode .toolbar{flex-wrap:wrap}
body.m-mode .topbar{flex-wrap:wrap}
/* 16w：手机版四个视图全部可用 —— 单列排版 + 横向滚动 + 卡片化 */
body.m-mode .lead-kpis{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px;-webkit-overflow-scrolling:touch}
body.m-mode .kpirz{display:none}
body.m-mode .kpi{padding:7px 12px}
body.m-mode .lead-legend{font-size:11.5px;margin:6px 2px 10px}
/* 分类导航：三列改单列，人员表移到下方 */
body.m-mode .lead-grid{grid-template-columns:minmax(0,1fr)}
body.m-mode .lead-cols{grid-template-columns:minmax(0,1fr)}
body.m-mode .lead-col{padding:10px 11px}
body.m-mode .lead-side{width:auto;margin-top:12px}
body.m-mode .lead-side table{font-size:12px}
/* 项目看板：卡片单列 */
body.m-mode .grid{grid-template-columns:minmax(0,1fr);gap:10px}
body.m-mode .card{padding:10px 12px}
body.m-mode .group{margin-bottom:16px}
/* 优先级象限：2×2 保留，卡片缩小，触摸好按 */
body.m-mode .quad{gap:8px}
body.m-mode .qcard{padding:8px 10px;min-height:38px;touch-action:pan-y}
body.m-mode .qhint{font-size:11.5px}
/* 明细表：横向滚动 + 工具条换行 */
body.m-mode .tblwrap{overflow-x:auto}
body.m-mode .tbar{gap:6px;row-gap:6px}
body.m-mode .tbar-tip{display:none}
/* 16x：手机版彻底关掉拖动排序（手指滑动必须留给页面滚动）——
   ① 拖动相关元素一律 touch-action:pan-y（原来 none 会把滚动手势吞掉，滚一半就不动了）；
   ② 拖宽把手隐藏；③ JS 里 pointerdown 直接不建立拖动会话。 */
body.m-mode .lead-row{flex-wrap:wrap;overflow:visible;touch-action:pan-y;user-select:auto;-webkit-user-select:auto;cursor:pointer}
body.m-mode .qcard{touch-action:pan-y}
body.m-mode .card{touch-action:pan-y;cursor:pointer}
body.m-mode #btnDragLock{display:none}
body.m-mode .kpirz{display:none}
/* 手机上的行/卡片按手指尺寸加高，点开更准 */
body.m-mode .lead-row{padding:10px 2px}
body.m-mode .m-wk .wk-btns button{width:38px;height:38px}
/* 16s：名称行与标识行都强制各占一整行（flex-basis:100%），杜绝名字短时标识挤到名字右边、
   名字长时才掉下去的「随机换行」偏差——所有子项版式完全一致，后续增项也固定此结构 */
.cat-main{flex:1 1 100%;display:block;min-width:0}
/* 16q：标识独立成行（与项目名行、负责人行、金额行统一为四行结构），后续增项也放这行 */
.cat-marks{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-left:10px;margin:1px 0;white-space:nowrap;flex:1 1 100%}
.lead-row .chev{color:var(--text-3);font-size:15px;flex:none}
.cat-sub{flex:1 1 100%;font-size:11.5px;color:var(--text-3);padding-left:10px;letter-spacing:.2px;word-break:break-all}
.btxt{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;line-height:1.6;background:var(--surface-2);color:var(--text);margin-bottom:4px}
/* ---------- 2026-10-16a：销售/战略合作文字标注 + BOSS 确定按钮 ---------- */
.boss-ok{display:flex;align-items:center;gap:10px;padding:6px 0 2px}
.boss-tip{font-size:12px;color:var(--text-3)}
/* ---------- 2026-10-16f：明细表 Excel 式排版（对齐/字体/行距行高/列宽 + 单元格内滚动） ---------- */
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;margin-bottom:10px;font-size:12.5px;color:var(--text-2)}
.tbar-t{font-weight:600;color:var(--text)}
.tbar-l{color:var(--text-3)}
.tbar .tseg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.tbar .tseg button{border:0;background:var(--surface);color:var(--text-3);padding:3px 8px;font-size:12px;cursor:pointer}
.tbar .tseg button + button{border-left:1px solid var(--line)}
.tbar .tseg button.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.tbar .tbtn{border:1px solid var(--line);background:var(--surface);color:var(--text-2);border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer}
.tbar .tbtn:hover{color:var(--blue);border-color:var(--blue)}
.tbar b{min-width:26px;text-align:center;color:var(--text);font-weight:600;display:inline-block}
.tbar select{height:24px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text-2);font-size:12px}
.tbar input[type=range]{width:100px;vertical-align:middle;accent-color:var(--blue)}
.tbar-tip{color:var(--text-3);font-size:11.5px}
.tbl th{position:relative}
.tbl.fixcol{table-layout:fixed}
.tbl.fixcol th{overflow:hidden;text-overflow:ellipsis}
.colrz{position:absolute;top:0;right:0;width:9px;height:100%;cursor:col-resize;touch-action:none;z-index:2}
.colrz:hover,.colrz.on{background:var(--blue);opacity:.4}
/* 行高拖拽把手：放在每行第一格左下角，上下拖改行高，双击恢复自动 */
.tbl tbody td:first-child{position:relative}
.rowrz{position:absolute;left:0;bottom:0;width:30px;height:7px;cursor:ns-resize;touch-action:none;z-index:2;border-radius:2px 0 0 0}
.rowrz:hover,.rowrz.on{background:var(--blue);opacity:.4}
.tbl td .tcell{display:block;overflow:visible}
.tbl.fixrow tr{height:var(--rowH)}
.tbl.fixrow td{padding-top:4px;padding-bottom:4px}
.tbl.fixrow td .tcell{max-height:calc(var(--rowH) - 10px);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.tbl.fixrow td .tcell::-webkit-scrollbar{width:7px}
.tbl.fixrow td .tcell::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.tbl.al-c td,.tbl.al-c th{text-align:center}
.tbl.al-r td,.tbl.al-r th{text-align:right}
.tbl.va-m td{vertical-align:middle}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView" class="login hide">
  <div class="lbox">
    <h1>战略项目看板</h1>
    <p class="sub">战略项目 · 项目动态实时表格</p>
    <div id="howToUse" class="warnbar" style="background:var(--surface-2);border:1px solid var(--line);color:var(--text-2)">
      <b>第一次使用？</b>
      点最下方「用邮箱验证码注册」→ 填邮箱 → 收 6 位验证码 → 设置一个不少于 6 位的密码 → 直接进入。<br>
      之后再打开就是「邮箱 + 密码」登录，勾选记住登录可 30 天免输。
      <div class="row">
        <button type="button" class="btn sm" id="btnCopyUrl3">复制访问链接（发给同事）</button>
      </div>
    </div>
    <div id="sandboxWarn" class="warnbar hide">
      <b id="sandboxHead">当前页面在受限预览框中运行</b>
      浏览器禁止本页读写本地存储，登录状态无法保存，微信扫码回跳也会失败。<br>请在独立标签页打开下面这个地址再登录。
      <div class="row">
        <button type="button" class="btn sm primary" id="btnOpenNew">在新标签页打开</button>
        <button type="button" class="btn sm" id="btnCopyUrl">复制链接</button>
      </div>
    </div>
    <div id="wxInAppTip" class="warnbar hide">
      <b id="wxInAppHead">你正在微信里打开</b>
      不用跳浏览器，就在这里用「邮箱 + 密码」登录即可查看全部项目。<br>
      首次使用点最下方「用邮箱验证码注册」，之后勾选记住登录，从微信点进来直接就进去了。
      <div class="row">
        <button type="button" class="btn sm" id="btnCopyUrl2">复制链接（转发给别人）</button>
      </div>
    </div>
    <div id="loginErr" class="errbox hide"></div>

    <div class="step"><i class="on" id="step1"></i><i id="step2"></i></div>
    <form id="loginForm">
      <div class="frow">
        <label>邮箱（任意能收信的邮箱均可）</label>
        <input class="field" id="lgEmail" type="email" placeholder="name@example.com" autocomplete="email" style="width:100%">
      </div>
      <div class="frow" id="pwdRow">
        <label>密码</label>
        <div class="pwdwrap">
          <input class="field" id="lgPwd" type="password" placeholder="登录密码" autocomplete="current-password">
          <button type="button" class="pwdtog" data-pwd-toggle="lgPwd" aria-label="显示密码" aria-pressed="false" title="显示密码">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.8 12S5.6 5.5 12 5.5 22.2 12 22.2 12 18.4 18.5 12 18.5 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
            <span class="pwtxt">显示</span>
          </button>
        </div>
      </div>
      <div class="frow hide" id="codeRow">
        <label>邮箱验证码</label>
        <input class="field" id="lgCode" placeholder="6 位验证码" autocomplete="one-time-code" style="width:100%">
      </div>
      <div class="frow hide" id="newPwdRow">
        <label>设置登录密码（不少于 6 位）</label>
        <div class="pwdwrap">
          <input class="field" id="lgNewPwd" type="password" placeholder="不少于 6 位" autocomplete="new-password">
          <button type="button" class="pwdtog" data-pwd-toggle="lgNewPwd" aria-label="显示密码" aria-pressed="false" title="显示密码">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.8 12S5.6 5.5 12 5.5 22.2 12 22.2 12 18.4 18.5 12 18.5 1.8 12 1.8 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>
            <span class="pwtxt">显示</span>
          </button>

<script>
/* ================= config ================= */
const PUBLIC_CONFIG = {
  endpoint: "https://your-board.example.com",
  oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",
  publishableKey: "REPLACE_WITH_YOUR_PUBLISHABLE_KEY"
};
const APP_VERSION = "1.0.0";

/* ==================== DEMO ADAPTER START ====================
   零配置演示模式：publishableKey 仍是占位值时自动启用。
   做法：只在 SDK 之下替换 cloud 实例，业务代码一行不改；
   填入真实 publishableKey（或 ?live=1）后自动回到云端模式。
   ?demo=1 强制演示，?reset=demo 清空本机演示数据。
   ============================================================ */
(function () {
  "use strict";
  var QS = new URLSearchParams(location.search);
  var PLACEHOLDER = "REPLACE_WITH_YOUR_PUBLISHABLE_KEY";
  var DEMO_ON = QS.get("live") === "1" ? false :
    (QS.get("demo") === "1" || !PUBLIC_CONFIG.publishableKey ||
      PUBLIC_CONFIG.publishableKey === PLACEHOLDER);
  window.SB_DEMO = DEMO_ON;

  if (!DEMO_ON) return;

  /* ---- 本机存储：file:// 下 localStorage 可能不可用，自动退回内存 ---- */
  var KEY = "sb_demo_db_v1", MEM = {};
  function sGet(k) { try { return localStorage.getItem(k); } catch (e) { return MEM[k] || null; } }
  function sSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { MEM[k] = v; } }
  function sDel(k) { try { localStorage.removeItem(k); } catch (e) { delete MEM[k]; } }
  if (QS.get("reset") === "demo") sDel(KEY);

  var TABLES = ["projects", "project_notes", "project_logs", "project_nexts",
                "project_files", "app_settings", "presence", "app_diag"];
  var DB = null;
  function now() { return new Date().toISOString(); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function seedDb() {
    var d = { _seq: 1, _files: {} };
    TABLES.forEach(function (t) { d[t] = []; });
    var demo = (typeof DEMO !== "undefined" && Array.isArray(DEMO)) ? DEMO : [];
    demo.forEach(function (x, i) {
      d.projects.push(Object.assign({
        id: d._seq++, status: "active", created_at: now(), updated_at: now(),
        deleted_at: null, amount_ytd: 0, landing_month: null,
        next_action_at: null, owner_id: "demo-user", sort_key: i, order_key: i
      }, x));
    });
    return d;
  }
  function db() {
    if (!DB) {
      try { var raw = sGet(KEY); DB = raw ? JSON.parse(raw) : seedDb(); }
      catch (e) { DB = seedDb(); }
      TABLES.forEach(function (t) { if (!Array.isArray(DB[t])) DB[t] = []; });
      if (!DB._files) DB._files = {};
      if (!DB._seq) DB._seq = DB.projects.reduce(function (m, r) {
        return Math.max(m, Number(r.id) || 0);
      }, 0) + 1;
      save();
    }
    return DB;
  }
  function save() { try { sSet(KEY, JSON.stringify(db())); } catch (e) {} }

  /* ---- PostgREST 风格链式 builder：await 时才真正执行 ---- */
  function Builder(table, op, payload) {
    this.t = table; this.op = op || "select"; this.payload = payload;
    this.filters = []; this.ord = null; this.lim = null; this.conflict = "id";
  }
  var P = Builder.prototype;
  P.select = function () { return this; };              /* 仅表示"返回受影响行"，不改操作 */
  P.insert = function (rows) { this.op = "insert"; this.payload = rows; return this; };
  P.update = function (patch) { this.op = "update"; this.payload = patch; return this; };
  P.upsert = function (row, opt) {
    this.op = "upsert"; this.payload = row;
    this.conflict = (opt && opt.onConflict) || "id"; return this;
  };
  P["delete"] = function () { this.op = "delete"; return this; };
  P.eq = function (c, v) { this.filters.push(function (r) { return String(r[c]) === String(v); }); return this; };
  P["in"] = function (c, arr) {
    var a = Array.isArray(arr) ? arr : [];
    this.filters.push(function (r) { return a.some(function (v) { return String(v) === String(r[c]); }); });
    return this;
  };
  function cmpFilter(fn) { return function (c, v) { this.filters.push(function (r) { return fn(r[c], v); }); return this; }; }
  P.gt = cmpFilter(function (a, v) { return a != null && String(a) > String(v); });
  P.gte = cmpFilter(function (a, v) { return a != null && String(a) >= String(v); });
  P.lt = cmpFilter(function (a, v) { return a != null && String(a) < String(v); });
  P.lte = cmpFilter(function (a, v) { return a != null && String(a) <= String(v); });
  P.order = function (c, opt) { this.ord = { c: c, desc: !!(opt && opt.ascending === false) }; return this; };
  P.limit = function (n) { this.lim = n; return this; };
  P.then = function (resolve) {
    try { resolve(exec(this)); }
    catch (e) { resolve({ data: null, error: e }); }
  };

  function exec(b) {
    var d = db();
    var rows = d[b.t] || (d[b.t] = []);
    var match = function () { return rows.filter(function (r) { return b.filters.every(function (f) { return f(r); }); }); };
    var out;
    if (b.op === "insert") {
      var list = Array.isArray(b.payload) ? b.payload : [b.payload];
      out = list.map(function (raw) {
        var row = Object.assign({ id: d._seq++, created_at: now(), updated_at: now() }, raw);
        rows.push(row); return clone(row);
      });
    } else if (b.op === "update") {
      out = match().map(function (r) { Object.assign(r, b.payload); return clone(r); });
    } else if (b.op === "upsert") {
      var key = b.conflict, val = String(b.payload[key]);
      var hit = rows.filter(function (r) { return String(r[key]) === val; })[0];
      if (hit) { Object.assign(hit, b.payload); out = [clone(hit)]; }
      else {
        var row2 = Object.assign({ id: d._seq++, created_at: now() }, b.payload);
        rows.push(row2); out = [clone(row2)];
      }
    } else if (b.op === "delete") {
      var hits = match(), ids = {};
      hits.forEach(function (r) { ids[r.id] = 1; });
      d[b.t] = rows.filter(function (r) { return !ids[r.id]; });
      out = hits.map(clone);
    } else {
      out = match().map(clone);
      if (b.ord) {
        var c = b.ord.c, desc = b.ord.desc;
        out.sort(function (a, z) {
          var A = a[c], Z = z[c];
          if (A == null && Z == null) return 0;
          if (A == null) return desc ? 1 : -1;
          if (Z == null) return desc ? -1 : 1;
          var k = (typeof A === "number" && typeof Z === "number") ? (A - Z) : String(A).localeCompare(String(Z));
          return desc ? -k : k;
        });
      }
      if (b.lim != null) out = out.slice(0, b.lim);
    }
    save();
    return { data: out, error: null };
  }

  /* ---- 附件：1 MB 以内转 dataURL 存本机，预览/下载照常可用 ---- */
  var MAX_FILE = 1024 * 1024;
  function readAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      try {
        var fr = new FileReader();
        fr.onload = function () { resolve(String(fr.result)); };
        fr.onerror = function () { reject(new Error("读取文件失败")); };
        fr.readAsDataURL(file);
      } catch (e) { reject(e); }
    });
  }
  function dataUrlToBlob(u) {
    var parts = String(u).split(",");
    var mime = (parts[0].match(/data:([^;]+)/) || [])[1] || "application/octet-stream";
    var bin = atob(parts[1] || ""), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }
  function result(v) { return { then: function (res) { res(v); } }; }
  function upload(path, file) {
    return { then: function (res) {
      if (file && file.size > MAX_FILE) {
        res({ data: null, error: { message: "演示模式仅支持 1 MB 以内的附件（配置云端后无限制）" } });
        return;
      }
      readAsDataUrl(file).then(function (u) {
        db()._files[path] = u; save(); res({ data: { path: path }, error: null });
      }).catch(function (e) { res({ data: null, error: e }); });
    } };
  }
  var bucket = {
    upload: upload,
    createSignedUploadUrl: function (path) { return result({ data: { token: "demo", path: path }, error: null }); },
    uploadToSignedUrl: function (path, token, file) { return upload(path, file); },
    download: function (path) {
      var u = db()._files[path];
      return result(u ? { data: dataUrlToBlob(u), error: null } : { data: null, error: { message: "文件不存在" } });
    },
    createSignedUrl: function (path) {
      return result({ data: { signedUrl: db()._files[path] || "" }, error: null });
    },
    remove: function (paths) {
      var list = Array.isArray(paths) ? paths : [paths];
      list.forEach(function (p) { delete db()._files[p]; });
      save(); return result({ data: list, error: null });
    }
  };

  /* ---- 免登录会话 ---- */
  var USER = { id: "demo-user", email: "demo@example.com", user_metadata: {} };
  var SESSION = { user: USER, access_token: "demo-token", token: { access_token: "demo-token" } };
  var localCloud = {
    auth: {
      getSession: async function () { return { data: SESSION, error: null }; },
      getUser: async function () { return { data: { user: USER }, error: null }; },
      getAccessToken: async function () { return { access_token: "demo-token" }; },
      signInWithPassword: async function () { return { data: SESSION, error: null }; },
      signOut: async function () { return { error: null }; },
      sendOtp: async function () { return { data: {}, error: null }; },
      verifyOtp: async function () { return { data: SESSION, error: null }; },
      handleWechatWebCallback: async function () { return {}; },
      onAuthStateChange: function () { return { data: { subscription: { unsubscribe: function () {} } } }; }
    },
    database: { from: function (t) { return new Builder(t); } },
    storage: {
      userPath: function (uid, name) { return "demo/" + uid + "/" + name; },
      from: function () { return bucket; }
    }
  };

  /* SDK 是 getter 导出的只读对象，整体替换全局 var 才是最稳的拦截点 */
  window.WorkBuddyCloud = { createWorkBuddyCloud: function () { return localCloud; } };
  /* 演示模式不产生任何对外请求，也不弹「访问地址不对」 */
  if (typeof diagPush === "function") diagPush = async function () {};
  if (typeof xhrFetch === "function") xhrFetch = async function () {
    return { ok: true, status: 200, text: async function () { return "[]"; }, json: async function () { return []; } };
  };
  if (typeof checkOrigin === "function") checkOrigin = function () {};
  if (typeof xhrUpload === "function") xhrUpload = async function () {
    return { ok: false, status: 0, text: "demo mode" };
  };
  if (typeof rawUpload === "function") rawUpload = async function () {
    return { ok: false, status: 0, text: "demo mode" };
  };

  /* ---- 右下角提示卡：不遮挡界面，可一键重置 ---- */
  function canPersist() {
    try { localStorage.setItem("__sb_probe__", "1"); localStorage.removeItem("__sb_probe__"); return true; }
    catch (e) { return false; }
  }
  function addBanner() {
    if (!document.body || document.getElementById("sbDemoBar")) return false;
    var tip = canPersist()
      ? "数据只保存在这台浏览器，示例均为虚构；无需登录、无需建表。"
      : "当前环境禁用了本地存储，刷新后数据会重置；示例均为虚构。";
    var bar = document.createElement("div");
    bar.id = "sbDemoBar";
    bar.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:99999;max-width:330px;" +
      "padding:14px 16px;border-radius:12px;background:#fffdf5;border:1px solid #e8d9a8;" +
      "box-shadow:0 8px 28px rgba(60,50,20,.16);font:13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#4a4128";
    bar.innerHTML =
      '<div style="font-weight:700;font-size:14px;margin-bottom:4px">🎯 演示模式</div>' +
      '<div>' + tip + '</div>' +
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button id="sbDemoReset" style="border:1px solid #d9c98f;background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px">重置演示数据</button>' +
      '<a href="https://github.com/mzc91992-afk/strategy-board-skill#%E5%BF%AB%E9%80%9F%E5%BC%80%E5%A7%8B" target="_blank" rel="noopener" style="color:#8a6d1f;font-size:12px;align-self:center">接入自己的云 ↗</a>' +
      '<button id="sbDemoClose" title="关闭" style="margin-left:auto;border:0;background:transparent;cursor:pointer;font-size:16px;color:#9c8c60">×</button>' +
      '</div>';
    document.body.appendChild(bar);
    var reset = document.getElementById("sbDemoReset");
    if (reset) reset.onclick = function () { sDel(KEY); location.reload(); };
    var close = document.getElementById("sbDemoClose");
    if (close) close.onclick = function () { bar.remove(); };
    return true;
  }
  var tries = 0;
  var timer = setInterval(function () {
    if (addBanner() || ++tries > 40) clearInterval(timer);
  }, 100);
})();
/* ===================== DEMO ADAPTER END ===================== */

const STALE_DAYS = 21;

/* 页面可能被嵌在沙箱 iframe（缺 allow-same-origin）里，此时触碰 localStorage 会直接抛异常。
   全站统一走这层门面：拿不到就退回内存存储，功能照常，只是刷新后不保留。 */
/* 部分老内核（含一些微信内置 WebView）不支持 type="month"，降级成文本框 */
const MONTH_TYPE = (() => {
  try {
    const i = document.createElement("input");
    i.setAttribute("type", "month");
    return i.type === "month" ? "month" : "text";
  } catch (e) { return "text"; }
})();

const STORE = (() => {
  let ls = null;
  try {
    ls = window.localStorage;
    ls.setItem("__sb_probe__", "1");
    ls.removeItem("__sb_probe__");
  } catch (e) { ls = null; }
  const mem = new Map();
  const backend = ls || {
    getItem: k => (mem.has(k) ? mem.get(k) : null),
    setItem: (k, v) => { mem.set(k, String(v)); },
    removeItem: k => { mem.delete(k); }
  };
  let framed = false;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }
  return {
    persistent: !!ls,
    framed,
    /* 本地存储不可用时会话存不住、微信回跳也读不回来，必须提示用户换到独立标签页 */
    restricted: !ls,
    get(k) { try { return backend.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { backend.setItem(k, String(v)); } catch (e) { /* 写不进去不影响主流程 */ } },
    remove(k) { try { backend.removeItem(k); } catch (e) { /* 同上 */ } }
  };
})();

/* 微信内置浏览器：用户无法自己扫自己屏幕上的二维码，且外链跳转常被拦 —— 必须引导到系统浏览器 */
const IN_WX = /MicroMessenger|wxwork/i.test(navigator.userAgent || "");
/* 手机/平板：微信网页登录在手机上是死路（二维码自己扫不了），必须走邮箱验证码 */
const IS_MOBILE = /Android|iPhone|iPod|iPad|HarmonyOS|Windows Phone|Mobile|MicroMessenger/i.test(navigator.userAgent || "");
const SHARE_URL = location.origin + location.pathname;
async function copyShareUrl(btn, txt){
  const t = txt || SHARE_URL;
  try {
    await navigator.clipboard.writeText(t);
    loginErr(txt ? "诊断信息已复制，发给开发者即可定位" : ("已复制链接：" + t), "ok");
  } catch (e) {
    /* 微信里 clipboard API 常常不可用，退回选中文本的老办法 */
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    document.body.removeChild(ta);
    loginErr(txt ? (ok ? "诊断信息已复制，发给开发者即可定位" : "复制失败，请长按下方文字手动复制") : (ok ? "已复制链接：" + t : "请手动复制：" + t), ok ? "ok" : "");
  }
}

/* ================= utils ================= */
const $ = (id) => document.getElementById(id);
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}
function maskPerson(v){
  const s = String(v || "").trim();
  if (!s) return "";  /* 多人名逐个处理，分隔符原样保留 */
  return s.split(/([、,，\/;；\s]+)/).map(part =>
    !part || /^[、,，\/;；\s]+$/.test(part) ? part
      : part[0] + "*".repeat(Math.min(3, Math.max(1, part.length - 1)))
  ).join("");
}
function maskOrg(v){
  const s = String(v || "").trim();
  if (!s) return "";
  return s.slice(0, 2) + "***" + (s.length > 6 ? s.slice(-1) : "");
}
/* 16v：「下一步」末尾的更新日期（取项目最后更新时间，M.D；naUpd 带括号、updMD 纯日期） */
/* 任意时间戳 → M.D（16x：下一步脉络/更新时间用） */
function stampMD(iso){
  const d = iso ? new Date(iso) : null;
  return d && !isNaN(d) ? (d.getMonth() + 1) + "." + String(d.getDate()).padStart(2, "0") : "";
}
function updMD(p){
  const d = p && p.updated_at ? new Date(p.updated_at) : null;
  return d && !isNaN(d) ? (d.getMonth() + 1) + "." + String(d.getDate()).padStart(2, "0") : "";
}
/* 下一步线索脉络：提交一次留一条，带**提交时间**；提交后的内容仍可编辑 / 删除（16x + 16z-3） */
function nextsHtml(p, canEdit){
  const arr = nextsOf(p.id);
  if (!arr.length) return "";
  return '<div class="nl-wrap"><div class="nl-h">下一步线索脉络 · ' + arr.length + ' 条（最新在最上）</div>' +
    arr.map(it => '<div class="nl-item" data-nlid="' + it.id + '">' +
      '<div class="nl-top"><span class="nl-time">提交 ' + escapeHtml(nlSubmitTime(it)) + nlEdited(it) + '</span>' +
      (canEdit ? '<span class="nl-btns"><button type="button" class="btn sm" data-nledit="' + it.id + '">编辑</button>' +
        '<button type="button" class="btn danger sm" data-nldel="' + it.id + '">删除</button></span>' : "") + '</div>' +
      '<div class="nl-txt">' + escapeHtml(it.content) + '</div></div>').join("") + '</div>';
}
/* 16z-3：改过内容的脉络，在提交时间后面补一个「已编辑」，提交时间本身不动 */
function nlEdited(it){
  const c = it && it.created_at, u = it && it.updated_at;
  if (!c || !u) return "";
  if (Math.abs(new Date(u).getTime() - new Date(c).getTime()) < 1000) return "";
  return ' <span class="tl-edited">· 已编辑 ' + fmtDate(u) + " " + hm(u) + "</span>";
}
function nlSubmitTime(it){
  return it && it.created_at ? fmtDate(it.created_at) + " " + hm(it.created_at) : "";
}
/* 常驻容器 —— 没有脉络时给一句说明，提交后原地刷新就能看到新的一条 */
function nextsBoxHtml(p, canEdit){
  const nxpid = p && p.id != null ? String(p.id) : "";
  return '<div id="nxBoxHost" data-nxpid="' + escapeHtml(nxpid) + '">' +
    (nextsHtml(p, canEdit) || '<div class="nx-none">还没有提交过的下一步，提交后会带时间显示在这里。</div>') +
    '</div>';
}
function naUpd(p){
  const m = updMD(p);
  return m ? "（更新 " + m + "）" : "";
}
const P = (p) => (p || "—");
const O = (o) => (o || "");
/* 长文本（商务关系这类整段说明）整体脱敏；关掉脱敏时原样返回，一个字都不改 */
function maskOn(v){
  const s = String(v == null ? "" : v);
  if (!S.mask || !s.trim()) return s;
  return maskPerson(s);
}
function money(n){
  if (n == null || n === "" || Number(n) === 0) return "—";
  const v = Number(n);
  if (!isFinite(v)) return "—";
  return v >= 10000 ? (v / 10000).toFixed(2) + " 亿" : v.toLocaleString("zh-CN") + " 万";
}
function ago(iso){
  if (!iso) return "—";
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (d <= 0) return "今天";
  if (d === 1) return "昨天";
  if (d < 30) return d + " 天前";
  if (d < 365) return Math.floor(d / 30) + " 个月前";
  return Math.floor(d / 365) + " 年前";
}
function staleDays(p){ return Math.floor((Date.now() - new Date(p.updated_at).getTime()) / 86400000); }
function isStale(p){ return p.status === "active" && staleDays(p) >= STALE_DAYS; }
function fmtDate(iso){
  const d = new Date(iso);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function hm(iso){ return new Date(iso).toTimeString().slice(0, 5); }
/* 预计落地时间只精确到年月，库里存 "2026-10" 这样的字符串，好排序也好比较 */
function monthLabel(v){
  const m = /^(\d{4})-(\d{1,2})$/.exec(String(v == null ? "" : v).trim());
  return m ? m[1] + "年" + Number(m[2]) + "月" : "";
}
function isMonth(v){ return /^\d{4}-\d{2}$/.test(String(v == null ? "" : v).trim()); }
/* 不支持 type=month 的浏览器（部分手机自带浏览器）会退化成文本框，
   这里把 2026/10、2026.10、2026年10月、202610 这类写法都归一成 2026-10 */
function normalizeMonth(v){
  const s = String(v == null ? "" : v).trim();
  let m = /^(\d{4})\s*[-\/.年]\s*(\d{1,2})/.exec(s);
  if (m) return m[1] + "-" + String(Number(m[2])).padStart(2, "0");
  m = /^(\d{4})(\d{2})$/.exec(s);
  if (m) return m[1] + "-" + m[2];
  return isMonth(s) ? s : "";
}
/* 过了预计落地月份还没关闭：返回逾期几个月，没逾期返回 0 */
function landingOverdue(p){
  const m = /^(\d{4})-(\d{1,2})$/.exec(String(p.landing_month == null ? "" : p.landing_month).trim());
  if (!m || p.status === "closed") return 0;
  const now = new Date();
  const diff = (now.getFullYear() - Number(m[1])) * 12 + (now.getMonth() + 1 - Number(m[2]));
  return diff > 0 ? diff : 0;
}
/* 排序用的月份键：统一成 "2026-10"，没填或格式不对返回空串 */
function monthKey(p){
  const s = String(p.landing_month == null ? "" : p.landing_month).trim();
  const m = /^(\d{4})-(\d{1,2})$/.exec(s);
  return m ? m[1] + "-" + String(Number(m[2])).padStart(2, "0") : "";
}
/* 时间线上的时间戳：始终显示写入时间，改动过就再补一个「已编辑 时间」 */
function tlStamp(r){
  if (!r || !r.created_at) return "";
  let s = fmtDate(r.created_at) + " " + hm(r.created_at);
  const u = r.updated_at;
  if (u && Math.abs(new Date(u).getTime() - new Date(r.created_at).getTime()) > 60000) {
    s += ` <span class="tl-edited">· 已编辑 ${fmtDate(u)} ${hm(u)}</span>`;
  }
  return s;
}
/* 周期分类：内置短期/中期/长期，允许用户改名、新增、删除自定义周期。
   配置存本机（每个人可以有不同的叫法），项目上只存周期 key，所以别人看到的是同一批项目、自己的叫法。 */
const HZ_BUILTIN = [
  { k: "short", n: "短期", d: "年内对集团有交代" },
  { k: "mid", n: "中期", d: "1–3 年的机会与订单" },
  { k: "long", n: "长期", d: "战略布局与培育" }
];
const HZ_BUILTIN_KEYS = HZ_BUILTIN.map(x => x.k);
function hzList(){
  try {
    const c = JSON.parse(STORE.get("sb_hz_cfg") || "null");
    if (Array.isArray(c) && c.length) {
      /* 内置项被误删时自动补回来，避免出现没有短期的看板 */
      HZ_BUILTIN.forEach(b => { if (!c.some(x => x.k === b.k)) c.push({ ...b }); });
      return c.filter(x => x && x.k);
    }
  } catch (e) { /* 配置坏了就用默认值 */ }
  return HZ_BUILTIN.map(x => ({ ...x }));
}
function hzSave(list){ STORE.set("sb_hz_cfg", JSON.stringify(list)); }
function hzFind(k){ return hzList().find(x => x.k === k); }
function hzName(k){ const it = hzFind(k); return it ? it.n : (k ? String(k) : "未分类"); }
function hzDesc(k){ const it = hzFind(k); return it ? (it.d || "") : ""; }
function hzTagClass(k){
  if (k === "short") return "t-short";
  if (k === "mid") return "t-mid";
  if (k === "long") return "t-long";
  return "t-custom";
}
function hzOptions(sel, withDesc){
  return hzList().map(x => `<option value="${escapeHtml(x.k)}"${x.k === sel ? " selected" : ""}>${escapeHtml(x.n + (withDesc && x.d ? "（" + x.d + "）" : ""))}</option>`).join("")
    + `<option value="__custom__">＋ 自定义输入…</option>`;
}
/* 周期下拉选了「自定义输入」时，把文本框里的新周期登记进配置后再用 */
function resolveHz(selId, inpId){
  const v = $(selId).value;
  if (v !== "__custom__") return { k: v };
  const n = ($(inpId).value || "").trim();
  if (!n) return { err: "选择了自定义周期，请在下方输入周期名称" };
  const list = hzList();
  const hit = list.find(x => x.n === n);
  if (hit) return { k: hit.k };
  const item = { k: "c" + Date.now().toString(36), n, d: "" };
  list.push(item); hzSave(list); paintHzFilter();
  return { k: item.k };
}
/* 自定义周期在项目里也能直接删：内置三项不允许删，删掉的项目落到「短期」 */
function bindHzDelete(p){
  const sel = $("eHz"), link = $("eHzDel");
  if (!sel || !link) return;
  const isCustom = k => !!k && HZ_BUILTIN_KEYS.indexOf(k) < 0;
  const sync = () => link.classList.toggle("hide", !isCustom(sel.value));
  sync();
  sel.addEventListener("change", sync);
  link.onclick = async () => {
    const k = sel.value;
    if (!isCustom(k)) return;
    const nm = hzName(k);
    const ids = S.projects.filter(x => x.horizon === k).map(x => x.id);
    if (!confirm(`删除自定义周期「${nm}」？${ids.length ? `有 ${ids.length} 个项目正在用它，会一并改到「${hzName("short")}」。` : ""}`)) return;
    hzSave(hzList().filter(x => x.k !== k));
    if (ids.length) await q(cloud.database.from("projects").update({ horizon: "short" }).in("id", ids));
    if (S.horizon === k) S.horizon = "";
    paintHzFilter();
    pushUndo(`删除周期「${nm}」`, async () => {
      const l = hzList(); l.push({ k, n: nm, d: "" }); hzSave(l); paintHzFilter();
      if (ids.length) await q(cloud.database.from("projects").update({ horizon: k }).in("id", ids));
      await afterUndo();
    });
    sel.innerHTML = hzOptions("short");
    sel.value = "short";
    sync();
    await refresh();
    openDrawer(p.id);
  };
}
function bindHzCustom(selId, inpId){
  const sel = $(selId); if (!sel) return;
  sel.addEventListener("change", () => {
    const custom = sel.value === "__custom__";
    $(inpId).classList.toggle("hide", !custom);
    if (custom) $(inpId).focus();
  });
}
/* 人名多选 chips：名单可增可删（每个名字带 ×），名单外的历史值也会作为已选 chip 保留，不丢数据 */
const ROSTER_DEF = { owner: ["成员甲", "成员乙", "成员丙", "成员丁"], note: ["成员甲", "成员乙", "成员丙", "成员丁", "成员戊"] };
function roster(key){
  try {
    const v = JSON.parse(STORE.get("sb_roster_" + key) || "null");
    return Array.isArray(v) ? v : ROSTER_DEF[key].slice();
  } catch(e){ return (ROSTER_DEF[key] || []).slice(); }
}
function setRoster(key, arr){ STORE.set("sb_roster_" + key, JSON.stringify(arr)); }
function splitNames(s){
  return String(s || "").split(/[、,，\/;；]+/).map(x => x.trim()).filter(Boolean);
}
function chipsInner(key, checkedArr){
  const list = roster(key);
  const extras = checkedArr.filter(c => list.indexOf(c) < 0);
  return list.concat(extras).map(n =>
    `<label class="chip"><input type="checkbox" value="${escapeHtml(n)}"${checkedArr.indexOf(n) >= 0 ? " checked" : ""}><span>${escapeHtml(n)}</span><i class="chipx" data-chip-del="${escapeHtml(n)}" data-chip-key="${key}" title="从名单中删除">×</i></label>`
  ).join("") + `<button type="button" class="chip add" data-chip-add="${key}" title="添加人员">＋ 添加</button>`;
}
function chipsHtml(id, key, checkedArr){
  return `<div class="chips" id="${id}" data-chip-key="${key}">` + chipsInner(key, checkedArr) + `</div>`;
}
function chipsVal(id){
  const el = $(id);
  return el ? [...el.querySelectorAll("input:checked")].map(i => i.value).join("、") : "";
}
function repaintChipBox(box){
  if (!box || !box.id || !box.dataset.chipKey) return;
  box.innerHTML = chipsInner(box.dataset.chipKey, splitNames(chipsVal(box.id)));
}
function repaintAllChips(){
  document.querySelectorAll(".chips[data-chip-key]").forEach(b => repaintChipBox(b));
}
function checkNamesIn(box, names){
  if (!box) return;
  names.forEach(n => {
    const el = [...box.querySelectorAll("input")].find(i => i.value === n);
    if (el) el.checked = true;
  });
}
/* 人员名单增删：挂在 document 上，抽屉每次重建也不用重新绑。
   点 × 直接删、不再弹确认（删错了用「＋ 添加」重新加回来就行） */
document.addEventListener("click", e => {
  const del = e.target.closest("[data-chip-del]");
  if (del) {
    e.preventDefault(); e.stopPropagation();
    const key = del.dataset.chipKey, name = del.dataset.chipDel;
    const box = del.closest(".chips");
    setRoster(key, roster(key).filter(x => x !== name));
    repaintChipBox(box);
    pushUndo("删除人员「" + name + "」", async () => {
      const arr = roster(key);
      if (arr.indexOf(name) < 0) { arr.push(name); setRoster(key, arr); }
      repaintAllChips();
    });
    return;
  }
  const add = e.target.closest("[data-chip-add]");
  if (add) {
    e.preventDefault(); e.stopPropagation();
    const key = add.dataset.chipAdd;
    /* 就地变成输入框，回车确认、Esc 取消，不弹系统对话框 */
    const inp = document.createElement("input");
    inp.className = "chip addinp";
    inp.type = "text";
    inp.placeholder = "姓名，回车确认";
    inp.dataset.chipAddinp = key;
    add.replaceWith(inp);
    inp.focus();
    const done = (save) => {
      if (inp.dataset.done) return;
      inp.dataset.done = "1";
      const raw = (inp.value || "").trim();
      const box = inp.closest(".chips");
      const names = save && raw ? splitNames(raw) : [];
      if (names.length) {
        const arr = roster(key);
        names.forEach(x => { if (arr.indexOf(x) < 0) arr.push(x); });
        setRoster(key, arr);
      }
      repaintChipBox(box);
      /* 刚添加的人默认勾上，省得再加一次点击 */
      checkNamesIn(box, names);
    };
    inp.addEventListener("keydown", ev => {
      if (ev.key === "Enter") { ev.preventDefault(); done(true); }
      else if (ev.key === "Escape") { ev.preventDefault(); done(false); }
    });
    inp.addEventListener("blur", () => done(true));
  }
});

const UNDO = [];

async function undoLast(){

/* 文本框拖拉以后记住尺寸（宽+高），下次打开同一个框还是这个大小。
   旧数据只存了一个数字（高度），这里兼容一下。 */
function taSizes(){ try { return JSON.parse(STORE.get("sb_ta_size") || "{}"); } catch(e){ return {}; } }
function bindTaResize(){
  const host = $("drawerHost"); if (!host) return;
  host.querySelectorAll("textarea[data-ta]").forEach(ta => {
    const s = taSizes()[ta.dataset.ta];
    if (typeof s === "number") { ta.style.height = s + "px"; }
    else if (s) {
      if (s.h) ta.style.height = s.h + "px";
      if (s.w) ta.style.width = s.w + "px";
    }
    const save = () => {
      const m = taSizes();
      m[ta.dataset.ta] = { h: Math.round(ta.offsetHeight), w: Math.round(ta.offsetWidth) };
      STORE.set("sb_ta_size", JSON.stringify(m));
    };
    ta.addEventListener("mouseup", save);
    ta.addEventListener("blur", save);
    ta.addEventListener("touchend", save);
    /* 拖坏了不至于卡死：记住过尺寸的框下面给一个「恢复默认大小」 */
    if (s) {
      const btn = document.createElement("div");
      btn.className = "ta-reset";
      btn.textContent = "恢复默认大小";
      btn.onclick = () => {
        const m = taSizes(); delete m[ta.dataset.ta];
        STORE.set("sb_ta_size", JSON.stringify(m));
        ta.style.height = ""; ta.style.width = "";
        btn.remove();
      };
      ta.parentNode.insertBefore(btn, ta.nextSibling);
    }
  });
}

    arr.unshift(obj);

/* 静态托管没有强制刷新的机制，浏览器常常拿到旧版本。延迟比对一次线上版本号 */
async function checkUpdate(){
  try {
    const res = await fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" });
    const txt = await res.text();
    const m = txt.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    if (m && m[1] !== APP_VERSION) {
      diagLog({ stage: "stale-version", running: APP_VERSION, latest: m[1] });
      if ($("updateBar")) return;
      const bar = document.createElement("div");
      bar.id = "updateBar";
      bar.className = "updatebar";
      bar.innerHTML = `<span>页面有新版本，当前运行的是旧版</span>
        <button class="btn sm primary" id="btnReloadNow">刷新到最新版</button>`;
      document.body.appendChild(bar);
      $("btnReloadNow").onclick = () => location.replace(location.pathname + "?t=" + Date.now());
    }
  } catch (e) { /* 拉不到就算了，不影响使用 */ }
}

function diagText(){
  let history = [];
  try { history = JSON.parse(STORE.get("sb_diag") || "[]"); } catch (e) { history = []; }
  return JSON.stringify({
    version: APP_VERSION,
    url: location.href,
    origin: location.origin,
    endpoint: PUBLIC_CONFIG.endpoint,
    sameOrigin: location.origin === PUBLIC_CONFIG.endpoint,
    ua: navigator.userAgent,
    mobile: IS_MOBILE,
    inWx: IN_WX,
    rememberLogin: !!readCred(),
    history
  }, null, 1);
}
