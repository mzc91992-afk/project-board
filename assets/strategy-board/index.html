/* ---- 云存储 CORS 兼容 ----
   SDK 的 storage 模块每次请求都会带上 X-Client-Info（还有上传时的 x-upsert），
   但服务端 Access-Control-Allow-Headers 里没有这两项，浏览器预检会直接失败，
   表现就是 upload/download 一律抛 "Failed to fetch"（数据库模块不带这些头，所以一直正常）。
   这里把请求头按服务端允许的白名单过滤一遍，并额外准备一条不经过 SDK 的原生上传通道。 */
const STORAGE_ALLOWED_HEADERS = ["authorization", "x-wb-webapp-access-key", "content-type", "accept",
  "prefer", "range", "content-range", "if-match", "if-none-match", "x-request-id", "x-device-id", "x-wb-webapp-language"];
function cleanHeaders(src){
  const out = {};
  try {
    if (src && typeof src.forEach === "function" && !src.entries) { src.forEach((v, k) => { if (STORAGE_ALLOWED_HEADERS.indexOf(String(k).toLowerCase()) >= 0) out[k] = v; }); return out; }
    Object.keys(src || {}).forEach(k => { if (STORAGE_ALLOWED_HEADERS.indexOf(String(k).toLowerCase()) >= 0) out[k] = src[k]; });
  } catch (e) {}
  return out;
}
function fixStorageCors(){
  try {
    const mod = cloud && cloud.storage; if (!mod) return;
    const targets = [];
    if (mod.fileApi) targets.push(mod.fileApi);
    if (mod.runtime && mod.runtime.fileApi) targets.push(mod.runtime.fileApi);
    const bucket = mod.from ? mod.from("runtime") : null;
    if (bucket && bucket.fileApi) targets.push(bucket.fileApi);
    targets.forEach(api => {
      if (api.headers) api.headers = cleanHeaders(api.headers);
      const orig = api.fetch;
      if (typeof orig === "function") {
        api.fetch = (url, opts) => {
          const o = Object.assign({}, opts || {});
          if (o.headers) o.headers = cleanHeaders(o.headers);
          return orig(url, o);
        };
      }
    });
  } catch (e) { diagLogSafe("storage-cors-fix", e); }
}
function diagLogSafe(stage, e){ try { diagReport(stage, String((e && e.message) || e)); } catch (x) {} }
async function cloudToken(){
  let t = "";
  try {
    const r = await cloud.auth.getAccessToken();
    t = typeof r === "string" ? r : ((r && (r.access_token || r.token)) || "");
  } catch (e) {}
  if (!t && session) t = session.access_token || (session.token && session.token.access_token) || "";
  return String(t || "");
}
/* 完全绕开 SDK 的原生上传：请求头只有服务端允许的那几个 */
async function rawUpload(path, f, token, fieldName){
  const url = PUBLIC_CONFIG.endpoint + "/.cloud/storage/object/runtime/" + String(path).split("/").map(encodeURIComponent).join("/");
  const fd = new FormData();
  fd.append("cacheControl", "3600");
  fd.append(fieldName, f, f.name);
  const res = await fetch(url, {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "X-Wb-Webapp-Access-Key": PUBLIC_CONFIG.publishableKey },
    body: fd
  });
  let txt = "";
  try { txt = await res.text(); } catch (e) {}
  return { ok: res.ok, status: res.status, text: String(txt).slice(0, 300) };
}
/* ================= 网络兜底 =================
   微信 / 部分国产浏览器内核里，fetch 会在请求发出前就失败（TypeError: Failed to fetch），
   而同源的 XMLHttpRequest 往往是通的。这里给 SDK 换一条"先 fetch、失败自动走 XHR"的通道。 */
function xhrFetch(url, opt){
  return new Promise(function(resolve, reject){
    try {
      var m = (opt && opt.method) || "GET";
      var x = new XMLHttpRequest();
      x.open(m, url, true);
      var hs = (opt && opt.headers) || {};
      if (hs && typeof hs.forEach === "function") {
        hs.forEach(function(v, k){ x.setRequestHeader(k, v); });
      } else if (hs) {
        Object.keys(hs).forEach(function(k){ x.setRequestHeader(k, hs[k]); });
      }
      x.onload = function(){
        resolve({
          ok: x.status >= 200 && x.status < 300,
          status: x.status,
          statusText: x.statusText || "",
          headers: { get: function(n){ return x.getResponseHeader(n); } },
          text: function(){ return Promise.resolve(x.responseText || ""); },
          json: function(){ return Promise.resolve(JSON.parse(x.responseText || "null")); }
        });
      };
      x.onerror = function(){ reject(new TypeError("Failed to fetch")); };
      x.ontimeout = function(){ reject(new TypeError("Network timeout")); };
      x.send(opt && opt.body !== undefined && opt.body !== null ? opt.body : null);
    } catch (e) { reject(e); }
  });
}
async function robustFetch(url, opt){
  const hasFetch = typeof window.fetch === "function";
  if (!hasFetch) return xhrFetch(url, opt);
  try {
    return await window.fetch(url, opt);
  } catch (e) {
    /* fetch 层面的失败（网络被拦、内核 bug、证书协商失败）才改走 XHR；
       HTTP 状态码错误属于业务结果，原样返回，不重试。 */
    try {
      diagLog({ stage: "net-xhr-fallback", msg: String((e && e.message) || e).slice(0, 120), u: String(url).slice(-60) });
    } catch (x) {}
    return xhrFetch(url, opt);
  }
}
/* 诊断上报也走 XHR，保证网络异常时还能留下线索 */
async function diagPush(stage, msg){
  try {
    await xhrFetch(PUBLIC_CONFIG.endpoint + "/.cloud/database/rest/app_diag", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
        "Prefer": "return=minimal",
        "X-Wb-Webapp-Access-Key": PUBLIC_CONFIG.publishableKey
      },
      body: JSON.stringify({ stage: String(stage).slice(0, 60), msg: String(msg).slice(0, 900) })
    });
  } catch (e) { /* 连诊断都发不出去就算了 */ }
}

/* 2026-11-02b：密码可见切换。用 document 级委托，登录密码框与注册设密码框共用一套逻辑 */
document.addEventListener("click", e => {
  const b = e.target && e.target.closest ? e.target.closest("[data-pwd-toggle]") : null;
  if (!b) return;
  e.preventDefault();
  const inp = document.getElementById(b.getAttribute("data-pwd-toggle"));
  if (!inp) return;
  const show = inp.type === "password";
  inp.type = show ? "text" : "password";
  b.setAttribute("aria-pressed", show ? "true" : "false");
  b.setAttribute("aria-label", show ? "隐藏密码" : "显示密码");
  b.title = show ? "隐藏密码" : "显示密码";
  const t = b.querySelector(".pwtxt");
  if (t) t.textContent = show ? "隐藏" : "显示";
  /* 切换后把光标放回末尾，别让人接着打字时跳到开头 */
  try { inp.focus({ preventScroll: true }); const n = inp.value.length; inp.setSelectionRange(n, n); } catch (x) {}
});

async function boot(){
  /* 2026-11-02b：地址栏加 ?reset=1（或 ?clean=1）一键清本机登录态。
     令牌被服务端轮换后，普通窗口（非无痕）会卡在坏状态，用这个不用开发者工具也能自救 */
  try {
    if (/[?&](reset|clean)=1(&|$)/.test(location.search)) {
      const keep = STORE.get(K_EMAIL);
      const dropped = purgeAuthStorage();
      if (keep) { try { STORE.set(K_EMAIL, keep); } catch (e) {} }
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
      diagLog({ stage: "manual-reset", msg: "dropped=" + dropped.length });
    }
  } catch (e) {}

  if (typeof WorkBuddyCloud === "undefined" || !WorkBuddyCloud.createWorkBuddyCloud) {
    showFatal("云服务 SDK 未能加载（cdn.jsdelivr.net 不可达或被拦截）。请换网络后重试，或联系开发者将 SDK 改为内联打包。");
    return;
  }
  cloud = WorkBuddyCloud.createWorkBuddyCloud({
    endpoint: PUBLIC_CONFIG.endpoint,
    oauthRelayBaseUrl: PUBLIC_CONFIG.oauthRelayBaseUrl,
    publishableKey: PUBLIC_CONFIG.publishableKey,
    fetch: robustFetch
  });

  const t = STORE.get("sb_theme");
  if (t) { document.documentElement.setAttribute("data-theme", t); $("btnTheme").textContent = t === "dark" ? "浅色" : "深色"; }

  /* ① 微信回调必须先跑，且必须早于任何登录守卫，否则 code 会被单点消耗掉 */
  let oauthSession = null;
  let cbReason = "";
  const backFromWechat = hasCallbackParams();
  diagLog({ stage: "boot", search: location.search.slice(0, 120) });
  /* 每次打开留一条到云端（6 小时节流）：出问题时能立刻确认用户跑的是哪个版本、什么环境，
     不用再靠猜是不是旧缓存 */
  try {
    const lastRep = Number(STORE.get("sb_boot_report") || 0);
    if (Date.now() - lastRep > 6 * 3600 * 1000) {
      STORE.set("sb_boot_report", String(Date.now()));
      diagPush("boot", JSON.stringify({
        v: APP_VERSION,
        ua: String(navigator.userAgent || "").slice(0, 140),
        online: navigator.onLine,
        restricted: !!STORE.restricted
      }));
    }
  } catch (e) {}
  /* 从微信跳回来时立刻给可见反馈，中间那几秒不能是一片空白 */
  if (backFromWechat) { showLogin(); loginErr("已完成微信授权，正在进入…", "ok"); }
  if (typeof cloud.auth.handleWechatWebCallback === "function") {
    const cb = await cloud.auth.handleWechatWebCallback().catch(e => ({ error: e }));
    if (cb && cb.error) {
      cbReason = cb.error.message || String(cb.error);
      cleanCallbackUrl();
    } else if (cb && cb.data) {
      oauthSession = cb.data;
      cleanCallbackUrl();
    } else if (backFromWechat) {
      /* 地址里有 code 却没换到会话：先把废票清掉，否则用户一刷新就会重复失败 */
      cleanCallbackUrl();
    }
  }
  diagLog({ stage: "callback", hadCode: backFromWechat, err: cbReason, gotSession: !!oauthSession });

  /* 登录态监听：会话晚一步落盘时，靠这条兜住，不必让用户再点一次 */
  cloud.auth.onAuthStateChange((e, s) => {
    if (s && !inApp) { enterApp(s); }
    else if (!s) { session = null; inApp = false; stopPolling(); stopPresence(); showLogin(); }
  });

  /* ② 依次尝试：微信回调会话 → 本地会话 →（刚从微信回来）短时重试 */
  let ok = oauthSession ? await enterApp(oauthSession) : false;
  if (!ok) {
    const s0 = await readSession();
    if (s0) ok = await enterApp(s0);
  }
  if (!ok) {
    /* ③ 记住登录 30 天：本机存着的邮箱+密码直接静默登录，用户什么都不用填 */
    const cred = readCred();
    if (cred) {
      const r = await cloud.auth.signInWithPassword({ email: cred.email, password: cred.pwd }).catch(() => ({ error: 1 }));
      if (r && r.data) ok = await enterApp(r.data);
      else clearCred(true);   /* 密码改过或已过期：清掉，别让用户每次都被拒一次 */
    }
  }
  if (!ok && (backFromWechat || cbReason)) {
    /* 会话偶尔会比页面晚一步落盘，这里短时重试，避免用户又走一遍扫码 */
    for (let i = 0; i < 5 && !ok; i++) {
      await sleep(400);
      const s1 = await readSession();
      if (s1) ok = await enterApp(s1);
    }
  }

  diagLog({ stage: "result", entered: ok, hadCode: backFromWechat });
  if (!ok) {
    showLogin();
    const already = cbReason && /重新|重试|再扫/.test(cbReason);
    loginErr(cbReason
      ? "微信登录未完成：" + cbReason + (already ? "" : "。请重新扫码，或用下方企业邮箱登录。")
      : (backFromWechat ? "微信已授权，但会话未能建立。请用下面的企业邮箱和密码登录。" : ""));
    return;
  }
  loginErr("");
}

/* 错误走顶部横幅，不再销毁整个界面 —— 一次网络抖动不该让用户丢掉当前视图 */
function showFatal(msg){
  const host = $("fatalHost");
  if (!host) return;
  host.classList.remove("hide");
  host.innerHTML = `<div class="fatalbar">
    <b>出错了</b><span id="fatalMsg"></span>
    <button class="btn sm" id="fatalCopy">复制</button>
    <button class="btn sm" id="fatalClose">关闭</button>
  </div>`;
  const detail = String(msg);
  $("fatalMsg").textContent = detail;
  /* 两个视图都没显示（多半是启动就崩了）时，至少把登录页露出来，不留整片空白 */
  if ($("loginView").classList.contains("hide") && $("appView").classList.contains("hide")) showLogin();
  $("fatalCopy").onclick = () => {
    const t = detail + "\n" + location.href + "\n" + navigator.userAgent;
    if (navigator.clipboard) navigator.clipboard.writeText(t).catch(() => {});
  };
  $("fatalClose").onclick = () => { host.classList.add("hide"); host.innerHTML = ""; };
}

/* 页面地址必须和数据服务同源：跨域时浏览器的预检会被网关 403 掉，
   表现就是"请求还没发出去就失败了"，fetch 和 XHR 都躲不过。 */
function checkOrigin(){
  if (location.origin === PUBLIC_CONFIG.endpoint) return;
  if ($("originWarn")) return;
  const box = document.createElement("div");
  box.id = "originWarn";
  box.className = "warnbar";
  box.innerHTML = '<b>当前打开的地址不对</b>' +
    '数据服务只认 <span style="word-break:break-all">' + escapeHtml(PUBLIC_CONFIG.endpoint) + '</span>。' +
    '从预览框、本地文件或转发后的其它地址打开时，浏览器会把请求当成跨域直接拦掉，登录必然失败。' +
    '<div class="row"><button type="button" class="btn sm primary" id="btnFixOrigin">用正确地址重新打开</button></div>';
  const lbox = document.querySelector("#loginView .lbox");
  if (!lbox) return;
  const anchor = lbox.querySelector("#howToUse");
  if (anchor) lbox.insertBefore(box, anchor); else lbox.insertBefore(box, lbox.firstChild);
  if ($("btnFixOrigin")) $("btnFixOrigin").onclick = () => location.replace(PUBLIC_CONFIG.endpoint + "/");
}
/* 出错时自己探一次，分两层：
   ① 不带自定义头的 GET —— 只判断"这台设备到服务器通不通"；
   ② 和登录完全同形态的 POST（同样带密钥、同样是 JSON 体），用一个必然不存在的账号，
      只探通路，碰不到任何真实账号。
   旧版只做 ①：跨源的简单 GET 一样能拿到 401，会把"跨域被拦"误判成"网络是通的"。 */
async function netProbe(){
  const cross = location.origin !== PUBLIC_CONFIG.endpoint;
  const probeAccount = "probe.nobody@invalid.local";
  let get = -1, post = -1, code = "", note = "";
  try {
    const r = await xhrFetch(PUBLIC_CONFIG.endpoint + "/.cloud/database/rest/app_diag?select=id&limit=1", {
      method: "GET", headers: { Accept: "application/json" }
    });
    get = r.status;
  } catch (e) { get = 0; }
  try {
    const r = await xhrFetch(PUBLIC_CONFIG.endpoint + "/.cloud/auth/v1/signin", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
        "X-Wb-Webapp-Access-Key": PUBLIC_CONFIG.publishableKey
      },
      body: JSON.stringify({ username: probeAccount, password: "probe-" + Date.now() })
    });
    post = r.status;
    let t = "";
    try { t = await r.text(); } catch (e) {}
    const m = String(t).match(/"code"\s*:\s*"([^"]+)"/);
    if (m) code = m[1];
  } catch (e) { post = 0; note = String((e && e.message) || e); }
  let text;
  if (post >= 200 && post < 500) {
    text = "网络没问题，登录这条路是通的（服务器回了 " + post + (code ? " " + code : "") + "）。刚才那一下属于偶发中断，再点一次登录基本就能过。";
  } else if (post >= 500) {
    text = "服务器自己报错了（" + post + "），过两分钟再试。";
  } else if (post === 0) {
    if (get === 0) text = "这台设备到服务器的网络整体不通，换 Wi-Fi 或关掉 VPN / 代理再试。";
    else if (cross) text = "请求被浏览器的跨域检查拦掉了：当前地址和数据服务不是同一个，必须换到正确地址打开。";
    else text = "能连上服务器（探测 " + get + "），但登录这个请求发不出去，是微信内核偶发掐断，退出微信重进或到系统浏览器打开即可。";
  } else {
    text = "服务器拒绝了请求（" + post + "）。";
  }
  return { status: post, get, post, code, text, cross, note };
}
/* 微信内置浏览器偶发在请求发出前掐断（TypeError: Failed to fetch）。
   这类失败重试一次往往就通，所以只对"网络类"失败重试；
   业务报错（密码错、验证码错）一次都不多试，免得把账号试锁。 */
const NET_FAIL_RE = /request failed before a response was received|Failed to fetch|NetworkError|Load failed|network|timeout/i;
function isNetFail(e){
  if (!e) return false;
  if (e.status === 0) return true;
  return NET_FAIL_RE.test(String(e.message || e));
}
async function withNetRetry(run, onTry){
  let last = null;
  for (let i = 0; i < 3; i++){
    if (i > 0){
      await sleep(i * 900);
      if (onTry) onTry(i + 1);
    }
    const r = await run().catch(e => ({ error: e }));
    if (!r || !r.error) return r;
    last = r.error;
    if (!isNetFail(last)) return r;
    try { diagLog({ stage: "login-retry", msg: String((last && last.message) || last).slice(0, 100) + " | try=" + (i + 1) }); } catch (x) {}
  }
  return { error: last };
}

/* ================= login flow ================= */
let pendingOtp = null;
let cdTimer = null;
let loginMode = "password";   /* password = 邮箱+密码；code = 验证码注册 */

/* ---- 记住登录 30 天：邮箱与密码只落在本机 localStorage，过期自动清掉 ---- */
const CRED_DAYS = 30;
const K_EMAIL = "sb_login_email", K_PWD = "sb_login_pwd", K_EXP = "sb_login_exp";
function saveCred(email, pwd){
  if (!email || !pwd) return;
  STORE.set(K_EMAIL, email);
  let enc = pwd;
  try { enc = btoa(unescape(encodeURIComponent(pwd))); } catch (e) { enc = pwd; }
  STORE.set(K_PWD, enc);
  STORE.set(K_EXP, String(Date.now() + CRED_DAYS * 86400000));
}
function readCred(){
  const exp = Number(STORE.get(K_EXP) || 0);
  if (!exp) return null;
  if (Date.now() > exp) { clearCred(true); return null; }
  const email = STORE.get(K_EMAIL), enc = STORE.get(K_PWD);
  if (!email || !enc) return null;
  let pwd = "";
  try { pwd = decodeURIComponent(escape(atob(enc))); } catch (e) { pwd = enc; }
  return pwd ? { email, pwd } : null;
}
function clearCred(keepEmail){
  STORE.remove(K_PWD); STORE.remove(K_EXP);
  if (!keepEmail) STORE.remove(K_EMAIL);
}

function isEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || "").trim()); }

function loginErr(msg, kind){
  const el = $("loginErr");
  if (!msg) { el.classList.add("hide"); el.className = "errbox hide"; return; }
  const raw = String(msg);
  let out = raw;
  const isNet = /request failed before a response was received|Failed to fetch|NetworkError|Load failed|network/i.test(raw);
  /* SDK 原文是英文，用户看不懂；网络层失败最常见，单独给说法、探测结果和退路 */
  if (isNet && kind !== "ok") {
    out = "连不上服务器，网络在请求发出前就被打断了（已自动重试 3 次都没通）。";
    el.className = "errbox";
    el.textContent = out + " 正在自动检测…";
    try { diagLog({ stage: "login-net-fail", msg: raw.slice(0, 120) }); } catch (e) {}
    netProbe().then(p => {
      try {
        diagLog({ stage: "net-probe", msg: JSON.stringify({ post: p.status, get: p.get, cross: p.cross, code: p.code, note: String(p.note).slice(0, 100) }) });
        diagPush("login-net-fail", raw.slice(0, 160) + " | post=" + p.status + " get=" + p.get + " code=" + p.code + " | cross=" + p.cross + " | " + location.href + " | " + navigator.userAgent);
      } catch (e) {}
      try {
        el.innerHTML = escapeHtml(out + " 自动检测：" + p.text) +
          (p.cross ? ' <button type="button" class="btn sm" id="btnFixOrigin2">用正确地址打开</button>' : "") +
          ' <button type="button" class="btn sm primary" id="btnRetryLogin2">再试一次</button>' +
          ' <button type="button" class="btn sm" id="btnCopyDiag2">复制诊断信息</button>';
        if ($("btnFixOrigin2")) $("btnFixOrigin2").onclick = () => location.replace(PUBLIC_CONFIG.endpoint + "/");
        if ($("btnRetryLogin2")) $("btnRetryLogin2").onclick = () => { loginErr(""); try { $("lgSubmit").click(); } catch (x) {} };
        if ($("btnCopyDiag2")) $("btnCopyDiag2").onclick = () => copyShareUrl($("btnCopyDiag2"), diagText() + "\npost=" + p.status + " get=" + p.get + " code=" + p.code + " cross=" + p.cross + "\nerr=" + raw);
      } catch (e) { el.textContent = out; }
    });
    return;
  }
  el.className = (kind === "ok" ? "okbox" : "errbox");
  el.textContent = out;
}
/* 两种登录形态：日常用「邮箱 + 密码」，首次注册用「邮箱验证码 + 设置密码」 */
function setMode(m){
  loginMode = m;
  const isCode = m === "code";
  const sent = isCode && !!pendingOtp;
  $("pwdRow").classList.toggle("hide", isCode);
  $("lgSend").classList.toggle("hide", !isCode);
  $("codeRow").classList.toggle("hide", !sent);
  $("newPwdRow").classList.toggle("hide", !(sent && !pendingOtp.isExistingUser));
  $("lgSubmit").classList.toggle("hide", isCode && !sent);
  $("btnCodeMode").classList.toggle("hide", isCode);
  $("lgBack").classList.toggle("hide", !isCode);
  $("lgSubmit").textContent = sent ? (pendingOtp.isExistingUser ? "验证并登录" : "注册并登录") : "登录";
  $("step2").classList.toggle("on", sent);
  if (!isCode) $("lgTip").textContent = "";
}
$("btnCodeMode").addEventListener("click", () => { loginErr(""); setMode("code"); $("lgEmail").focus(); });
$("lgBack").addEventListener("click", () => {
  pendingOtp = null; clearInterval(cdTimer);
  $("lgEmail").readOnly = false; $("lgCode").value = ""; $("lgNewPwd").value = "";
  setMode("password");
  loginErr("");
});

$("lgEmail").addEventListener("input", () => loginErr(""));

$("lgSend").addEventListener("click", async () => {
  const email = $("lgEmail").value.trim();
  if (!isEmail(email)) { loginErr("请输入有效的企业邮箱"); return; }
  loginErr("");
  $("lgSend").disabled = true; $("lgSend").textContent = "发送中…";
  const sent = await withNetRetry(() => cloud.auth.sendOtp({ email }), n => { $("lgSend").textContent = "第 " + n + " 次发送…"; });
  $("lgSend").disabled = false; $("lgSend").textContent = "重新发送验证码";
  if (sent.error) { loginErr(sent.error.message || "验证码发送失败，请稍后重试"); return; }
  STORE.set(K_EMAIL, email);
  pendingOtp = { email, verificationId: sent.data.verificationId, isExistingUser: sent.data.isExistingUser };
  $("lgEmail").readOnly = true;
  setMode("code");
  loginErr(sent.data.isExistingUser ? "验证码已发送，填入后即可登录。" : "验证码已发送，设置密码后即可注册并登录。", "ok");
  $("lgCode").focus();
  startCountdown();
});

function startCountdown(){
  let n = 60;
  clearInterval(cdTimer);
  cdTimer = setInterval(() => {
    n--;
    if (n <= 0) { clearInterval(cdTimer); $("lgTip").textContent = ""; $("lgSend").disabled = false; return; }
    $("lgTip").textContent = n + " 秒后可重新发送";
    $("lgSend").disabled = n > 0;
  }, 1000);
}

/* 登录成功后统一收口：会话偶尔比页面晚一步落盘，短时重试几次再判定失败 */
async function landAfterLogin(){
  let ok = await enterApp(await readSession());
  for (let i = 0; i < 4 && !ok; i++) { await sleep(400); ok = await enterApp(await readSession()); }
  if (!ok) loginErr("已通过验证，但会话未能建立，请刷新页面重试");
  return ok;
}

$("loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const email = $("lgEmail").value.trim();
  if (!isEmail(email)) { loginErr("请输入有效的企业邮箱"); return; }
  loginErr("");
  const remember = $("lgRemember").checked;

  /* ① 日常：邮箱 + 密码 */
  if (loginMode === "password") {
    const pwd = $("lgPwd").value;
    if (!pwd) { loginErr("请输入密码"); return; }
    $("lgSubmit").disabled = true; $("lgSubmit").textContent = "登录中…";
    const r = await withNetRetry(
      () => cloud.auth.signInWithPassword({ email, password: pwd }),
      n => { $("lgSubmit").textContent = "第 " + n + " 次尝试…"; }
    );
    $("lgSubmit").disabled = false; $("lgSubmit").textContent = "登录";
    if (r.error) {
      const raw = r.error.message || "登录失败";
      const bad = r.error.kind === "unauthenticated" || r.error.status === 401 || r.error.status === 400;
      /* 登录失败也上报一条（走匿名 XHR，不依赖登录态），下次排查不用再猜 */
      try {
        diagPush("login-fail", JSON.stringify({
          msg: String(raw).slice(0, 200), st: r.error.status || 0,
          code: r.error.code || r.error.kind || "", v: APP_VERSION,
          ua: String(navigator.userAgent || "").slice(0, 120)
        }));
      } catch (x) {}
      loginErr(bad ? "邮箱或密码不正确。首次使用请点下方「用邮箱验证码注册」。" : raw);
      return;
    }
    STORE.set(K_EMAIL, email);
    if (remember) saveCred(email, pwd); else clearCred(true);
    await landAfterLogin();
    return;
  }

  /* ② 首次注册 / 老用户免密登录：邮箱验证码 */
  const code = $("lgCode").value.trim();
  if (!pendingOtp || pendingOtp.email !== email) { loginErr("请先获取邮箱验证码"); return; }
  if (!code) { loginErr("请输入邮箱验证码"); return; }
  const pwd = $("lgNewPwd").value;
  const isNew = !pendingOtp.isExistingUser;
  if (isNew && pwd.length < 6) { loginErr("首次使用请设置不少于 6 位的密码"); return; }
  $("lgSubmit").disabled = true; $("lgSubmit").textContent = "验证中…";
  const done = await withNetRetry(() => cloud.auth.verifyOtp({
    email: pendingOtp.email,
    verificationId: pendingOtp.verificationId,
    isExistingUser: pendingOtp.isExistingUser,
    token: code,
    password: isNew ? pwd : undefined
  }), n => { $("lgSubmit").textContent = "第 " + n + " 次尝试…"; });
  $("lgSubmit").disabled = false; $("lgSubmit").textContent = isNew ? "注册并登录" : "验证并登录";
  if (done.error) { loginErr(done.error.message || "验证失败，请检查验证码"); return; }
  /* 新用户注册时设了密码 → 直接记住；老用户走验证码没输密码，下次仍走密码登录 */
  STORE.set(K_EMAIL, email);
  if (remember && isNew) saveCred(email, pwd); else clearCred(true);
  pendingOtp = null; clearInterval(cdTimer);
  await landAfterLogin();
});

/* 数据库 builder 是 thenable（await 才发请求），不是 Promise —— 不能挂 .catch */
async function q(builder){
  try { return await builder; } catch (e) { return { data: null, error: e }; }
}

/* ================= data ================= */
/* 登录态失效自愈（2026-11-02）
   以前：token 失效时 refresh 只把「同步失败」写在角落，界面停在空看板上；
   用户点退出再登录，走的是同一条路，于是表现成「数据读不出来、也登不进去」。
   现在：识别到 401/403/JWT 类错误 → 清掉本机失效会话 → 用记住的密码静默重登一次；
        还不行就明确回到登录页，并说清「登录已失效，请重新输入密码」。 */
let RECOVERING = false;
async function recoverAuth(reason){
  if (RECOVERING) return false;
  RECOVERING = true;
  try { diagPush("auth-recover", String(reason || "").slice(0, 200) + " | v=" + APP_VERSION); } catch (e) {}
  try { await cloud.auth.signOut().catch(() => {}); } catch (e) {}
  session = null; inApp = false;
  try { stopPolling(); stopPresence(); } catch (e) {}
  const cred = readCred();
  if (cred) {
    const r = await cloud.auth.signInWithPassword({ email: cred.email, password: cred.pwd }).catch(() => ({ error: 1 }));
    if (r && r.data) {
      diagPush("auth-recover-ok", "silent re-login ok");
      /* 注意：RECOVERING 要等 enterApp 整条链路跑完再放开，
         否则 enterApp 里的 refresh 再次失败会递归回到这里 */
      const ok = await enterApp(r.data);
      RECOVERING = false;
      return ok;
    }
  }
  /* 静默重登也不行（密码改过 / 没记住）：清掉失效凭据，交回登录页，别让用户一直点重试 */
  clearCred(true);
  RECOVERING = false;
  showLogin();
  loginErr("登录状态已失效（" + String(reason || "需要重新登录") + "）。本机失效记录已清掉，请重新输入密码登录。");
  return false;
}
/* 2026-11-02：别再把后端错误「压平」。
   以前是 throw new Error(err.message || "数据读取失败")，status / code / kind 全被丢掉，
   界面上永远只剩「数据读取失败」四个字，也没法判断是不是登录失效、更没法自动恢复。 */
function normErr(e, fallback){
  if (e instanceof Error && e.message) {
    if (e.status == null && e.cause && e.cause.status) e.status = e.cause.status;
    return e;
  }
  const err = new Error((e && (e.message || e.error_description || e.error)) || fallback);
  if (e) {
    if (e.status != null) err.status = e.status;
    if (e.statusCode != null && err.status == null) err.status = Number(e.statusCode) || err.status;
    if (e.code) err.code = e.code;
    if (e.kind) err.kind = e.kind;
    if (e.details) err.details = e.details;
  }
  return err;
}
/* 读不到数据时留个逃生口：同步状态那行字可以点，点一下重新登录一次，
   不用让用户自己去找「退出」再摸黑重试 */
function offerRelogin(){
  const el = $("syncTxt");
  if (!el || el.__reloginBound) return;
  el.__reloginBound = true;
  el.style.cursor = "pointer";
  el.title = "点这里重新登录一次";
  el.onclick = () => {
    if (confirm("重新登录一次？会清掉本机失效的登录记录，数据不会受影响。")) recoverAuth("用户手动重新登录");
  };
}
async function refresh(){
  if (!session) return;
  S.dirty = true; paintSync();
  try { await doFetch(); }
  catch (e) {
    S.dirty = false; paintSync();
    const msg = (e && (e.message || e.error_description)) || "网络异常";
    const st = (e && (e.status || (e.cause && e.cause.status))) || 0;
    const code = (e && (e.code || e.kind)) || "";
    try { diagPush("refresh-fail", JSON.stringify({ msg: String(msg).slice(0, 200), st: st, code: String(code), v: APP_VERSION })); } catch (x) {}
    if (st === 401 || st === 403 || /jwt|token|expired|unauthor|unauthentic|permission denied|not.authorized|invalid.credential|invalid.*grant/i.test(String(msg) + " " + String(code))) {
      setSync("err", "登录已过期，正在重新登录…");
      await recoverAuth(st ? ("接口返回 " + st) : String(code || msg).slice(0, 60));
      return;
    }
    setSync("err", "同步失败：" + msg);
    offerRelogin();
    return;
  }
  S.lastSync = Date.now(); S.dirty = false; paintSync();
  render();
}
async function doFetch(){
  const pr = await q(cloud.database.from("projects").select("*"));
  if (pr.error) throw normErr(pr.error, "数据读取失败");
  /* 删掉的项目不再物理删除，只是打上 deleted_at 移进回收站：这里分成两份，
     S.projects 只留正常项目，其它代码（卡片 / 表格 / 统计 / 汇报）不用改 */
  const all = pr.data || [];
  S.trash = all.filter(p => p.deleted_at);
  S.projects = all.filter(p => !p.deleted_at);
  await loadLeadCfg();
  const ids = S.projects.map(p => p.id);
  if (ids.length) {
    const lg = await q(cloud.database.from("project_logs").select("*").in("project_id", ids).order("created_at", { ascending: false }));
    if (lg.error) throw normErr(lg.error, "进展读取失败");
    const rows = lg.data || [];
    S.logs = {};
    rows.forEach(r => { (S.logs[r.project_id] = S.logs[r.project_id] || []).push(r); });

    /* 简介历史 + 领导批注共用一张表，用 kind 区分。表是后加的，老环境没这张表时不能让整个看板挂掉 */
    const nt = await q(cloud.database.from("project_notes").select("*").in("project_id", ids).order("created_at", { ascending: false }));
    S.notes = {};
    if (!nt.error) {
      (nt.data || []).forEach(r => { (S.notes[r.project_id] = S.notes[r.project_id] || []).push(r); });
    } else {
      diagLog({ stage: "notes-unavailable", msg: String(nt.error.message || "").slice(0, 160) });
    }
    /* 附件：表是后加的，读不到就让这块空着，不能连累整个看板 */
    const fl = await q(cloud.database.from("project_files").select("*").in("project_id", ids).order("created_at", { ascending: false }));
    S.files = {};
    if (!fl.error) {
      (fl.data || []).forEach(r => { (S.files[r.project_id] = S.files[r.project_id] || []).push(r); });
    } else {
      diagLog({ stage: "files-unavailable", msg: String(fl.error.message || "").slice(0, 160) });
    }
    /* 16x：下一步动作脉络（每次改写下一步都留一条，带填写时间，可编辑删除）；
       表是后加的，读不到就空着，不能连累整个看板 */
    const nx = await q(cloud.database.from("project_nexts").select("*").in("project_id", ids).order("created_at", { ascending: false }));
    S.nexts = {};
    if (!nx.error) {
      (nx.data || []).forEach(r => { (S.nexts[r.project_id] = S.nexts[r.project_id] || []).push(r); });
    } else {
      diagLog({ stage: "nexts-unavailable", msg: String(nx.error.message || "").slice(0, 160) });
    }
  } else { S.logs = {}; S.notes = {}; S.files = {}; S.nexts = {}; }
}
/* 下一步脉络 */
function nextsOf(id){
  const arr = ((S.nexts && S.nexts[id]) || []).slice();
  /* 16z-3：刚提交的那一版可能还没被读回来（网络慢/写失败），先按本地的样子显示出来 */
  const last = NEXT_LAST;
  if (last && String(last.pid) === String(id) && !arr.some(x => String(x.id) === String(last.id)))
    arr.unshift({ id: last.id, project_id: id, content: last.content, created_at: last.created_at });
  return arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
}
/* 记一条下一步脉络。
   16z-2：一次"编辑会话"只留**一条** —— 抽屉打开期间反复改下一步，一律 UPDATE 同一条，
   以最后一次「失焦 / 点保存 / 关抽屉」时的内容为准，不再停手一次就多记一条。 */
let NEXT_DRAFT = null;   /* { pid, id } —— 本次编辑会话正在写的那条 */
let NEXT_LAST = null;    /* 16z-3：刚提交的那一版，refresh 万一没读回来也能先显示 */
let NEXT_KEEP = false;   /* 16z-3：改完脉络要重绘抽屉 —— 那是重画界面，不是换会话，别把会话记的头掐掉 */
function endNextDraft(){ NEXT_DRAFT = null; NEXT_LAST = null; }
async function touchNextAt(pid, now){
  const p = S.projects.find(x => String(x.id) === String(pid));
  if (p) p.next_action_at = now;
  await q(cloud.database.from("projects").update({ next_action_at: now }).eq("id", pid));
}
async function recordNextRaw(pid, content){
  const txt = String(content == null ? "" : content).trim();
  if (!pid || !txt) return;
  const now = new Date().toISOString();
  /* 先把草稿 id 抄到本地：等待请求期间可能被关抽屉清掉，再去读就会踩空 */
  const draft = NEXT_DRAFT, did = (draft && String(draft.pid) === String(pid) && draft.id) ? draft.id : "";
  if (did) {
    const up = await q(cloud.database.from("project_nexts").update({ content: txt, created_at: now }).eq("id", did));
    if (up.error) { if (NEXT_DRAFT && String(NEXT_DRAFT.id) === String(did)) NEXT_DRAFT = null; }  /* 那条可能已被删掉，下次重新插 */
    else {
      const hit = (S.nexts[pid] || []).find(x => String(x.id) === String(did));
      if (hit) { hit.content = txt; hit.created_at = now; }
      else (S.nexts[pid] = S.nexts[pid] || []).unshift({ id: did, project_id: pid, content: txt, created_at: now });
      if (NEXT_LAST && String(NEXT_LAST.id) === String(did)) { NEXT_LAST.content = txt; NEXT_LAST.created_at = now; }
      await touchNextAt(pid, now);
      return;
    }
  }
  const ins = await q(cloud.database.from("project_nexts").insert({ project_id: pid, content: txt, created_at: now }).select());
  const row = !ins.error && Array.isArray(ins.data) && ins.data[0] ? ins.data[0]
    : { id: "tmp" + Date.now(), project_id: pid, content: txt, created_at: now };
  (S.nexts[pid] = S.nexts[pid] || []).unshift(row);
  NEXT_DRAFT = { pid: pid, id: row.id };
  NEXT_LAST = { pid: pid, id: row.id, content: txt, created_at: now };   /* 16z-3：提交后立刻要在界面上看到它 */
  await touchNextAt(pid, now);
}
/* 串行执行：失焦与关抽屉几乎同时发生时，两条写入不会互相插队写成两条 */
let NEXT_Q = Promise.resolve();
function recordNext(pid, content){
  NEXT_Q = NEXT_Q.then(() => recordNextRaw(pid, content)).catch(() => {});
  return NEXT_Q;
}
/* 提交脉络：点「提交」按钮、点「保存修改」、关抽屉时各调一次；同一会话只会更新同一条 */
async function commitNext(pid){
  const el = $("eNext");
  const txt = el ? String(el.value || "").trim() : "";
  if (!pid || !txt) return;
  await recordNext(pid, txt);
}
/* 16z-3：打字不记录 —— 只有点「提交」按钮（或失焦 / 保存 / 关抽屉）才把当前这一版存进脉络，并带上提交时间 */
let NX_SUBMIT_TS = 0;
function paintNextsBox(pid){
  const host = $("nxBoxHost");
  if (!host) return;
  const p = S.projects.find(x => String(x.id) === String(pid));
  if (!p) return;
  host.innerHTML = nextsHtml(p, true) || '<div class="nx-none">还没有提交过的下一步，提交后会带时间显示在这里。</div>';
}
async function submitNext(pid, manual){
  const el = $("eNext");
  const txt = el ? String(el.value || "").trim() : "";
  if (!txt) { if (manual) drawerErr("先写一句下一步动作，再点「提交」"); return false; }
  NX_SUBMIT_TS = Date.now();                 /* 点按钮会先失焦一次，别再重复提交 */
  await commitNext(pid);
  await refresh();                            /* 黄点 / 看板数据跟着走，抽屉不重建所以输入不被打断 */
  paintNextsBox(pid);
  const ok = $("nxOk");
  if (ok) ok.textContent = "已提交 · " + fmtDate(new Date()) + " " + hm(new Date());
  return true;
}
/* 16x：本周项目状态更新 = 本周期内有「项目状态动态」**或**「下一步动作」被更新过 */
function hasUpdInWeek(p, wr){
  return statusUpdInWeek(p, wr) || inWeek(p.next_action_at, wr);
}
/* kind: "summary" 简介历史 / "note" 领导批注 */
function notesOf(id, kind){
  const arr = (S.notes[id] || []).filter(n => n.kind === kind);

let UP_FIELD = null; /* 服务端认的 multipart 字段名，探测一次就记住，省得每个大文件都试两遍 */
/* 原生 XHR 上传：fetch 拿不到进度，XHR 的 upload.onprogress 能拿到，大文件必须走这条 */
function xhrUpload(path, blob, filename, token, fieldName, onP){
  return new Promise(resolve => {
    try {
      const url = PUBLIC_CONFIG.endpoint + "/.cloud/storage/object/runtime/" + String(path).split("/").map(encodeURIComponent).join("/");
      const fd = new FormData();
      fd.append("cacheControl", "3600");
      fd.append(fieldName, blob, filename || "file");
      const xhr = new XMLHttpRequest();
      xhr.open("POST", url, true);
      if (token) xhr.setRequestHeader("Authorization", "Bearer " + token);
      xhr.setRequestHeader("X-Wb-Webapp-Access-Key", PUBLIC_CONFIG.publishableKey);
      let lastLoaded = 0, lastT = 0;
      if (xhr.upload && typeof onP === "function") {
        xhr.upload.onprogress = e => {
          if (!e.lengthComputable) return;
          const now = Date.now(), dt = (now - lastT) / 1000;
          let sp = 0;
          if (!lastT) { lastT = now; lastLoaded = e.loaded; }
          else if (dt >= 0.5) { sp = Math.max(0, (e.loaded - lastLoaded) / dt); lastLoaded = e.loaded; lastT = now; }
          if (typeof onP === "function") onP(e.loaded, e.total, sp);
        };
      }
      xhr.onload = () => resolve({ ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status, text: String(xhr.responseText || "").slice(0, 300) });
      xhr.onerror = () => resolve({ ok: false, status: 0, text: "network error" });
      xhr.ontimeout = () => resolve({ ok: false, status: -2, text: "timeout" });
      xhr.onabort = () => resolve({ ok: false, status: -3, text: "aborted" });
      xhr.send(fd);
    } catch (e) { resolve({ ok: false, status: -4, text: String((e && e.message) || e) }); }
  });
}
/* 先用 1 字节小文件探出服务端要的字段名，避免 100 MB 的文件白传一遍 */
async function probeUploadField(uid, p, token){
  if (UP_FIELD !== null) return UP_FIELD;
  let tiny = null;
  try { tiny = new Blob(["ok"], { type: "text/plain" }); } catch (e) { return null; }
  const pth = cloud.storage.userPath(uid, "projects/" + p.id + "/.probe-" + Date.now() + ".txt");
  for (const fn of ["", "file"]) {
    let r = null;
    try { r = await xhrUpload(pth, tiny, "probe.txt", token, fn, null); }
    catch (e) { r = { ok: false, status: -5, text: String((e && e.message) || e) }; }
    if (r.ok) { UP_FIELD = fn; try { await diagReport("upload-probe-ok", JSON.stringify({ field: fn || "(空)", status: r.status })); } catch (e) {} return fn; }
    try { await diagReport("upload-probe-fail", JSON.stringify({ field: fn || "(空)", status: r.status, text: r.text })); } catch (e) {}
  }
  return null;
}

function safeKeyName(nm){
  const cleaned = String(nm || "file").replace(/[^A-Za-z0-9._\-\u3400-\u4dbf\u4e00-\u9fff]/g, "_");
  return (cleaned.replace(/_{2,}/g, "_").replace(/^[_ .\-]+/, "").slice(0, 120)) || "file";

    return { done: [], failed: ["登录信息取不到，请退出重新登录后再传"] };
  }

  const field = await probeUploadField(uid, p, tk);

  for (let i = 0; i < files.length; i++) {

    let pth = cloud.storage.userPath(uid, "projects/" + p.id + "/" + Date.now() + "-" + i + "-" + Math.random().toString(36).slice(2, 7) + "-" + safeKeyName(f.name));

      if (typeof onProgress === "function") onProgress({ index: i, count: files.length, name: f.name, loaded: loaded, size: size || total || 0, speed: speed, note: note || "" });
    };
    tick(0, size, 0);

    const attempt = async (path, note) => {

      if (note) tick(0, size, 0, note);

        if (!r.ok && (r.status === 0 || r.status === -2 || r.status >= 500)) { await sleep(600); r = await xhrUpload(path, f, f.name, tk, field, tick); }
        if (r.ok) { up = { data: { path: path }, error: null }; tick(size, size, 0); }

          const other = field === "" ? "file" : "";
          const r2 = await xhrUpload(path, f, f.name, tk, other, tick);
          if (r2.ok) { up = { data: { path: path }, error: null }; UP_FIELD = other; tick(size, size, 0); }

      const pth2 = cloud.storage.userPath(uid, "projects/" + p.id + "/" + Date.now() + "-" + i + "-" + Math.random().toString(36).slice(2, 6) + "-file" + ext);
      const up2 = await attempt(pth2, "文件名里有特殊字符，改成安全名字重传…");

    }
    const ins = await q(cloud.database.from("project_files").insert({
      owner_id: uid, project_id: p.id, name: f.name, path: pth,

/* 上传进度：文件名 + 百分比 + 进度条 + 已传/总量 + 速度 + 预计剩余时间 */

   ① 点下去立刻弹出窗口（里面是「正在准备预览…」），不再让用户对着页面干等；
   ② 文件内容与签名链接两个请求同时发出，谁先回来就用谁；
   ③ 同一文件第二次点开走缓存，秒开（本地 blob 长期有效，签名链接记 50 分钟）。 */
const PV_CACHE = {};

function pvCacheGet(path){
  const c = PV_CACHE[path];

  if (c.exp && Date.now() > c.exp) { delete PV_CACHE[path]; return null; }
  return c;
}
function pvCachePut(f, url, kind){
  if (!url) return;

async function pvBlobUrl(f){

  } catch (e) { return ""; }
}
async function previewFile(f){

  showPreview(f, null, k);                                       /* 第一次：先弹窗 */
  const needBlob = (k === "image" || k === "pdf" || k === "text");
  const pBlob = needBlob ? pvBlobUrl(f) : null;                  /* 两个请求一起发，不等 */
  const pSign = signedUrlFor(f);

async function signedUrlFor(f){

/* 不经过 SDK 的签名链接请求：请求头只带服务端允许的那几个 */
async function rawSignedUrl(path){
  try {
    const url = PUBLIC_CONFIG.endpoint + "/.cloud/storage/object/sign/runtime/" + String(path).split("/").map(encodeURIComponent).join("/");
    const token = await cloudToken();
    const headers = { "Content-Type": "application/json", "X-Wb-Webapp-Access-Key": PUBLIC_CONFIG.publishableKey };
    if (token) headers.Authorization = "Bearer " + token;
    const res = await fetch(url, { method: "POST", headers: headers, body: JSON.stringify({ expiresIn: 3600 }) });
    const txt = await res.text();
    let j = null; try { j = JSON.parse(txt); } catch (e) {}

    if (res.ok && su) return PUBLIC_CONFIG.endpoint + "/.cloud/storage" + (String(su).indexOf("/") === 0 ? su : "/" + su);
    try { await diagReport("preview-raw-sign-fail", JSON.stringify({ path: path, status: res.status, body: String(txt).slice(0, 300) })); } catch (e) {}
  } catch (e) {
    try { await diagReport("preview-raw-sign-throw", JSON.stringify({ path: path, err: String((e && e.message) || e) })); } catch (x) {}
  }

function pvGeomDefault(){

  if (vw <= 720) return { x: 8, y: 8, w: Math.max(300, vw - 16), h: Math.max(240, vh - 16) };   /* 手机上直接铺满屏幕 */
  const w = Math.max(320, Math.min(900, vw - 32)), h = Math.max(240, Math.min(760, Math.round(vh * 0.8)));

function pvGeom(){

    if (j && Number(j.w) >= 360 && Number(j.h) >= 240) {

      /* 换到小屏幕（手机）时把记下的尺寸收进屏幕内 */

  };
  const start = (e, dir) => {
    if (box.classList.contains("pv-max") || box.classList.contains("pv-min")) return;
    if (dir !== "mv") e.preventDefault();
    e.stopPropagation();
    st = Object.assign({ dir: dir, sx: e.clientX, sy: e.clientY, cur: null }, geomNow());
    try { e.target.setPointerCapture(e.pointerId); } catch (x) {}
  };
  const move = e => {
    if (!st) return;
    const dx = e.clientX - st.sx, dy = e.clientY - st.sy;
    const vw = window.innerWidth || 1024, vh = window.innerHeight || 768;
    const d = st.dir, g = { x: st.x, y: st.y, w: st.w, h: st.h };
    if (d === "mv") { g.x = st.x + dx; g.y = st.y + dy; }
    else {
      if (d.indexOf("e") >= 0) g.w = st.w + dx;
      if (d.indexOf("s") >= 0) g.h = st.h + dy;
      if (d.indexOf("w") >= 0) { g.w = st.w - dx; g.x = st.x + dx; }
      if (d.indexOf("n") >= 0) { g.h = st.h - dy; g.y = st.y + dy; }
      /* 缩到最小时，从左/上拖不能把窗口推走 */
      if (g.w < MINW) { if (d.indexOf("w") >= 0) g.x = st.x + st.w - MINW; g.w = MINW; }
      if (g.h < MINH) { if (d.indexOf("n") >= 0) g.y = st.y + st.h - MINH; g.h = MINH; }
    }
    g.w = Math.max(MINW, Math.min(g.w, vw - 24));
    g.h = Math.max(MINH, Math.min(g.h, vh - 24));
    g.x = Math.max(0, Math.min(g.x, vw - g.w));
    g.y = Math.max(0, Math.min(g.y, vh - g.h));
    box.style.left = g.x + "px"; box.style.top = g.y + "px";
    box.style.width = g.w + "px"; box.style.height = g.h + "px";
    st.cur = g;
  };
  const end = () => { if (st && st.cur) pvGeomSet(st.cur); st = null; };
  box.querySelectorAll("[data-pvd]").forEach(h => {
    const dir = h.dataset.pvd;
    h.addEventListener("pointerdown", e => start(e, dir));
    h.addEventListener("pointermove", move);
    h.addEventListener("pointerup", end);
    h.addEventListener("pointercancel", end);
  });
  const head = $("pvHead");
  if (head) {
    head.addEventListener("pointerdown", e => { if (e.target.closest(".pvbtn")) return; start(e, "mv"); });
    head.addEventListener("pointermove", move);
    head.addEventListener("pointerup", end);
    head.addEventListener("pointercancel", end);
  }
}

/* ================= filters / computed ================= */
function steppers(list){
  return list.filter(p => {
    if (S.horizon && p.horizon !== S.horizon) return false;
    if (p.status === "draft" && S.status !== "draft") return false;
    if (S.status && p.status !== S.status) return false;
    if (S.q) {
      const t = (p.name + " " + (p.counterparty || "") + " " + (p.category || "") + " " + (p.summary || "")).toLowerCase();
      if (!t.includes(S.q.toLowerCase())) return false;
    }
    return true;
  });
}
function weight(p){ return (p.importance || 1) * (p.urgency || 1); }
function sortList(list){
  const a = [...list];
  if (S.sort === "amount") a.sort((x, y) => (y.amount_plan || 0) - (x.amount_plan || 0));
  else if (S.sort === "urgency") a.sort((x, y) => (y.urgency || 0) - (x.urgency || 0) || weight(y) - weight(x));
  else if (S.sort === "recent") a.sort((x, y) => new Date(y.updated_at) - new Date(x.updated_at));
  else if (S.sort === "landing") a.sort((x, y) => {
    /* 按预计落地时间从近到远；没填落地时间的排在最后，它们之间再按优先级排 */
    const xm = monthKey(x), ym = monthKey(y);
    if (xm && ym) return xm < ym ? -1 : (xm > ym ? 1 : weight(y) - weight(x));
    if (xm) return -1;
    if (ym) return 1;
    return weight(y) - weight(x);
  });
  else a.sort((x, y) => weight(y) - weight(x) || (y.amount_plan || 0) - (x.amount_plan || 0));
  return a;
}

/* 周期（用户 16u 重新定位、16v 修正锚点）：一个周期 = **某周五 00:00 → 下个周五 24:00**（8 个自然日，含首尾）。
   锚点 = 「包含今天的周期」的起点周五：
   - 周一～周四：本周一 - 3 天（上周末前的那个周五，即上周五）；
   - 周五：今天是当前周期最后一天 → 起点为 7 天前（上周五，本周 = 上周五→本周五，如 10.09–10.16）；
   - 周六/周日：昨天/前天就是周五 → 今天属于新周期（起点 = 本周六前的那个周五），周末数据不落空。
   start 之后 end = start + 8 天（= 下个周五 24:00 = 再下个周六 00:00）。 */
function weekRange(off){
  const d = new Date();

  const start = new Date(t); start.setDate(t.getDate() - back);

  const f = x => (x.getMonth() + 1) + "." + String(x.getDate()).padStart(2, "0");
  const last = new Date(end); last.setDate(end.getDate() - 1);

      document.querySelectorAll(".lead-col.over").forEach(x => x.classList.remove("over"));
      if (cell && zone !== d.zone) cell.classList.add("over");

    document.querySelectorAll(".lead-row.dropbefore").forEach(x => x.classList.remove("dropbefore"));
    if (cell && d.insertIdx != null) {
      const rs = [...cell.querySelectorAll(".lead-row")].filter(r => r !== d.row);

    LEAD_SUPPRESS_AT = 0;

  }, true);
}
async function endLeadDrag(e){
  const d = LEAD_DRAG; if (!d) return;
  LEAD_DRAG = null;
  d.row.classList.remove("dragging");
  document.querySelectorAll(".lead-col.over").forEach(x => x.classList.remove("over"));
  if (d.ghost) d.ghost.remove();
  if (d.moved) LEAD_SUPPRESS_AT = Date.now();
  const pending = LEAD_PENDING_RENDER; LEAD_PENDING_RENDER = false;
  let target = d.lastZone;
  if (!target && e) { const cell = leadColOf(document.elementFromPoint(e.clientX, e.clientY)); if (cell) target = cell.dataset.colid; }
  document.querySelectorAll(".lead-row.dropbefore").forEach(x => x.classList.remove("dropbefore"));
  if (!d.moved || !target) { if (pending) render(); return; }
  if (target === d.zone) {   /* 同列落下：只调顺序 */
    const colEl = document.querySelector('.lead-col[data-colid="' + target + '"]');
    const rows = colEl ? [...colEl.querySelectorAll(".lead-row")] : [];
    const ordered = rows.map(r => S.projects.find(x => String(x.id) === (r.dataset.detail || r.dataset.open))).filter(Boolean);
    const rest = ordered.filter(x => x.id !== d.p.id);
    rest.splice(d.insertIdx == null ? rest.length : Math.min(d.insertIdx, rest.length), 0, d.p);
    await saveOrder(rest);
    leadMsg("已调整「" + d.p.name + "」的顺序");
    return;
  }
  const before = d.p.nav_col;
  const patch = { nav_col: target, updated_at: new Date().toISOString() };
  Object.assign(d.p, { nav_col: target, updated_at: patch.updated_at });
  render();
  const res = await q(cloud.database.from("projects").update(patch).eq("id", d.p.id).select());
  if (res.error || !Array.isArray(res.data) || !res.data.length) {
    d.p.nav_col = before; render();
    leadMsg("移动失败，已还原：" + ((res.error && res.error.message) || "没有修改这条记录的权限"), true);
    return;
  }
  {  /* 移过去之后顺便按落点排序 */
    const colEl2 = document.querySelector('.lead-col[data-colid="' + target + '"]');
    const rows2 = colEl2 ? [...colEl2.querySelectorAll(".lead-row")] : [];
    const ordered2 = rows2.map(r => S.projects.find(x => String(x.id) === (r.dataset.detail || r.dataset.open))).filter(Boolean);
    const rest2 = ordered2.filter(x => x.id !== d.p.id);
    rest2.splice(d.insertIdx == null ? rest2.length : Math.min(d.insertIdx, rest2.length), 0, d.p);
    await saveOrder(rest2);
  }
  leadMsg("「" + d.p.name + "」已移到「" + leadName(leadColById(target)) + "」");
}

async function saveOrder(listOrdered){
  const changed = [];
  listOrdered.forEach((p, i) => {
    const k = 1000 - i * 10;
    if ((p.order_key || 0) !== k) { p.order_key = k; changed.push({ id: p.id, k }); }
  });
  render();
  if (!changed.length || !cloud) return;

/* 指针落在容器里第几个位置：第一个「中线在指针下方」的条目之前 */
function insertIdxWithin(container, rowSel, e, skip){
  const rows = [...container.querySelectorAll(rowSel)].filter(r => r !== skip);
  for (let i = 0; i < rows.length; i++) {
    const rc = rows[i].getBoundingClientRect();
    if (e.clientY < rc.top + rc.height / 2) return i;
  }
  return rows.length;
}

/* 导航筛选：kpi（all/week/new/hi）、sales/bd、own:<track>:<人名> */
function navLabel(f){
  if (f === "week") return "本周更新与新增";
  if (f === "new") return "本周新增";
  if (f === "hi") return "重点突破项目";
  if (f === "sales") return "销售类项目";
  if (f === "bd") return "战略合作类项目";
  if (f === "subst") return "实质推进项目（本周期有实质性推进动态）";
  if (f === "ap") return "需董事长审批的项目";
  if (f && f.indexOf("own:") === 0) {
    const parts = f.split(":");
    return parts.slice(2).join(":") + " 主导的" + (parts[1] === "sales" ? "销售类" : "战略合作类") + "项目";
  }
  return "";
}
function applyNavFilter(list){
  const f = S.navFilter;
  if (S.view !== "cats" || !f) return list;
  const wr = clipFuture(weekRange(WEEK_OFF));
  return list.filter(p => {
    if (f === "week") return hasUpdInWeek(p, wr) || inWeek(p.created_at, wr);
    if (f === "new") return inWeek(p.created_at, wr);
    if (f === "hi") return quadZone(p) === "hi";
    if (f === "sales" || f === "bd") return trackOf(p) === f;
    if (f === "subst") return (S.notes[p.id] || []).some(n => n.kind === "status" && n.subst && inWeek(n.created_at, wr));
    if (f === "ap") return !!(p.boss_approval && String(p.boss_approval).trim());
    if (f.indexOf("own:") === 0) {
      const parts = f.split(":");
      if (trackOf(p) !== parts[1]) return false;
      const o = parts.slice(2).join(":");
      /* 用户定版：点负责人只看他主导的项目（名单第一位），协作项目不出现 */
      const names = String(p.owner_label || "").trim().split(/[、,，\/;；\s]+/).filter(Boolean);
      if (!names.length) return false;
      const lead = names[0];
      return lead === o || P(lead) === o || lead.startsWith(o) || o.startsWith(lead);
    }
    return true;
  });
}

/* ---------- 优先级象限：四个格子，项目卡片直接拖过去 ---------- */
/* 拖动状态放外面：拖的过程中若被 12 秒一次的轮询重绘打断，卡片会跟丢 */
let QUAD_DRAG = null, QUAD_SUPPRESS_AT = 0, QUAD_PENDING_RENDER = false;
const QZONES = [
  { k: "hi",    n: "① 重点突破",      d: "重要且紧急，资源优先" },
  { k: "plan",  n: "② 主动规划",      d: "重要但不急，做计划推进" },
  { k: "watch", n: "③ 盯住窗口",      d: "紧急但不重要，抓时机" },
  { k: "hold",  n: "④ 观察 / 可取舍", d: "不重要不急，考虑关停" }
];
function quadZone(p){
  const im = p.importance || 1, ur = p.urgency || 1;
  if (im >= 3 && ur >= 3) return "hi";
  if (im >= 3) return "plan";
  if (ur >= 3) return "watch";
  return "hold";
}
/* 拖到某一格后，重要度 / 紧急度该变成多少：
   只动"必须动"的那一项，另一项保留原值，改动尽量小。
   例：重 5 紧 4（重点突破）拖到「主动规划」→ 重 5 紧 2。 */
function quadFit(zone, im, ur){
  im = Math.min(5, Math.max(1, im || 1));
  ur = Math.min(5, Math.max(1, ur || 1));
  if (zone === "hi")    return { imp: Math.max(3, im), urg: Math.max(3, ur) };
  if (zone === "plan")  return { imp: Math.max(3, im), urg: Math.min(2, ur) };
  if (zone === "watch") return { imp: Math.min(2, im), urg: Math.max(3, ur) };
  return { imp: Math.min(2, im), urg: Math.min(2, ur) };
}
function qcardHtml(p){
  const im = p.importance || 1, ur = p.urgency || 1;
  const sub = `${escapeHtml(p.stage || "—")} · ${money(p.amount_plan)}`;
  return `<div class="qcard ${p.status === "active" ? "" : "notactive"}" data-open="${p.id}"
    data-imp="${im}" data-urg="${ur}"
    title="${escapeHtml(p.name)}${p.counterparty ? "｜" + escapeHtml(p.counterparty) : ""}｜按住可拖到别的象限">${escapeHtml(p.name)}<small>${sub}</small></div>`;
}
function viewQuad(list){
  /* 画哪些项目交给工具栏的「状态」筛选，这里不另设一套，免得两处口径打架 */
  const box = { hi: [], plan: [], watch: [], hold: [] };
  list.forEach(p => box[quadZone(p)].push(p));
  Object.keys(box).forEach(k => box[k].sort(orderCmp));
  const cell = z => `<div class="qcell qc-${z.k}" data-zone="${z.k}">
      <div class="qch"><h4>${z.n}</h4><span class="cnt">${box[z.k].length} 个</span></div>
      <div class="qcd">${z.d}</div>
      <div class="qdrop">${box[z.k].map(qcardHtml).join("") || '<div class="qnone">把项目拖到这里</div>'}</div>
    </div>`;
  return `<div class="qwrap">
    <div class="qhint">按住项目卡片，直接拖到想放的那个象限里，松手就改好优先级并存到云端（<b>例如把「示例专项」从重点突破拖到主动规划</b>）——需先在工具栏解锁拖动。点一下卡片打开项目档案。虚线卡片是暂缓 / 已关闭的项目。</div>
    <div class="qmsg" id="qMsg"></div>
    <div class="quad">${QZONES.map(cell).join("")}</div>
  </div>`;
}
/* 事件全挂在 document 上：象限每次重绘都会换 DOM，挂在元素上会失效 */
function bindQuad(){
  document.addEventListener("pointerdown", e => {
    if (e.button != null && e.button > 0) return;
    if (S.dragLock || S.mode === "mobile") return;   /* 16v 拖动锁 / 16x 手机版不拖动 */
    const card = e.target.closest && e.target.closest(".qcard");
    if (!card) return;
    const p = S.projects.find(x => String(x.id) === String(card.dataset.open));
    if (!p) return;
    QUAD_DRAG = {
      card, p, x0: e.clientX, y0: e.clientY, moved: false, ghost: null, zone: quadZone(p), lastZone: null
    };
    try { card.setPointerCapture(e.pointerId); } catch (_) {}
    /* 这里不调 preventDefault：它会把兼容性 mouse 事件一起掐掉，点一下开档案就失灵了。
       防选中靠 CSS user-select:none，防滚动靠卡片上的 touch-action:none */
  });
  document.addEventListener("pointermove", e => {
    const d = QUAD_DRAG; if (!d) return;
    /* 6px 以内算点击，不算拖动 —— 免得手抖一下就改了优先级 */
    if (!d.moved && Math.abs(e.clientX - d.x0) + Math.abs(e.clientY - d.y0) < 6) return;
    if (!d.moved) {
      d.moved = true;
      d.card.classList.add("dragging");
      const g = document.createElement("div");
      g.className = "qghost";
      g.innerHTML = d.card.innerHTML;
      document.body.appendChild(g);
      d.ghost = g;
    }
    const gw = d.ghost.offsetWidth || 200, gh = d.ghost.offsetHeight || 40;
    d.ghost.style.left = Math.max(4, Math.min(window.innerWidth - gw - 4, e.clientX - 14)) + "px";
    d.ghost.style.top = Math.max(4, Math.min(window.innerHeight - gh - 4, e.clientY - gh / 2)) + "px";
    /* 影子不接收事件，这里才能拿到指针底下的那个象限格子 */
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const cell = under && under.closest ? under.closest(".qcell") : null;
    const zone = cell ? cell.dataset.zone : null;
    if (zone !== d.lastZone) {
      document.querySelectorAll(".qcell.over").forEach(x => x.classList.remove("over"));
      if (cell && zone !== d.zone) cell.classList.add("over");
      d.lastZone = zone;
    }
    d.insertIdx = cell ? insertIdxWithin(cell, ".qcard", e, d.card) : null;
    e.preventDefault();
  });
  document.addEventListener("pointerup", endQuadDrag);
  document.addEventListener("pointercancel", endQuadDrag);
  /* 拖完那一下的 click 要拦掉，否则会顺手把项目档案打开 */
  document.addEventListener("click", e => {
    if (Date.now() - QUAD_SUPPRESS_AT > 400) return;
    QUAD_SUPPRESS_AT = 0;
    e.stopImmediatePropagation(); e.preventDefault();
  }, true);

async function endQuadDrag(e){
  const d = QUAD_DRAG; if (!d) return;
  QUAD_DRAG = null;
  d.card.classList.remove("dragging");
  document.querySelectorAll(".qcell.over").forEach(x => x.classList.remove("over"));
  if (d.ghost) d.ghost.remove();
  if (d.moved) QUAD_SUPPRESS_AT = Date.now();
  const pending = QUAD_PENDING_RENDER; QUAD_PENDING_RENDER = false;
  let target = d.lastZone;
  /* 松手时没算出格子（比如指针在格子外面）就用指针位置再判一次 */
  if (!target && e) {
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const cell = under && under.closest ? under.closest(".qcell") : null;
    if (cell) target = cell.dataset.zone;
  }
  if (!d.moved || !target) { if (pending) render(); return; }
  if (target === d.zone) {   /* 同一格内落下：只调顺序，不改优先级 */
    const cell = document.querySelector('.qcell[data-zone="' + target + '"]');
    const rows = cell ? [...cell.querySelectorAll(".qcard")] : [];
    const ordered = rows.map(r => S.projects.find(x => String(x.id) === r.dataset.open)).filter(Boolean);
    const rest = ordered.filter(x => x.id !== d.p.id);
    rest.splice(d.insertIdx == null ? rest.length : Math.min(d.insertIdx, rest.length), 0, d.p);
    await saveOrder(rest);

    return;
  }
  const oldI = Number(d.card.dataset.imp) || 1, oldU = Number(d.card.dataset.urg) || 1;

  quadSavePriority(d.p, fit.imp, fit.urg, { importance: oldI, urgency: oldU });

async function quadSavePriority(p, imp, urg, before){

  Object.assign(p, { importance: imp, urgency: urg, updated_at: patch.updated_at });
  render();   /* 先本地重绘，手感上立刻生效；下面的 qMsg 要在重绘之后再取 */
  const res = await q(cloud.database.from("projects").update(patch).eq("id", p.id).select());
  const msg = $("qMsg");
  if (res.error || !Array.isArray(res.data) || !res.data.length) {
    Object.assign(p, before); render();
    const m2 = $("qMsg");
    if (m2) {
      m2.className = "qmsg err";
      m2.textContent = "保存失败，已还原：" + ((res.error && res.error.message) || "没有修改这条记录的权限");
    }
    return;
  }
  pushUndo("调整优先级", undoProjectPatch(p.id, before));
  if (msg) {
    const z = QZONES.find(x => x.k === quadZone({ importance: imp, urgency: urg }));
    msg.className = "qmsg";
    msg.textContent = `已把《${p.name}》移到「${z ? z.n : ""}」`;
  }
}

/* ---------- 输出 Excel：内置最小 zip(STORE) 写入器生成真 .xlsx，无需外部库 ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function u8cat(...as){ const n = as.reduce((a, b) => a + b.length, 0), o = new Uint8Array(n); let p = 0; as.forEach(a => { o.set(a, p); p += a.length; }); return o; }
const u16 = v => new Uint8Array([v & 255, (v >>> 8) & 255]);
const u32 = v => new Uint8Array([v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]);
/* files: [name, str][] → zip 字节（全部 STORE 不压缩，Excel/WPS 均可打开） */
function zipStore(files){
  const enc = new TextEncoder(), chunks = [], central = []; let off = 0;
  files.forEach(([name, str]) => {
    const nm = enc.encode(name), d = enc.encode(str), c = crc32(d);
    const lh = u8cat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0), u32(c), u32(d.length), u32(d.length), u16(nm.length), u16(0));
    chunks.push(lh, nm, d);
    central.push(u8cat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0), u32(c), u32(d.length), u32(d.length), u16(nm.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(off), nm));
    off += lh.length + nm.length + d.length;
  });
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const eocd = u8cat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(cdSize), u32(off), u16(0));
  return u8cat(...chunks, ...central, eocd);
}
function xlColName(n){ let s = ""; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
/* rows: string[][] → .xlsx 字节（单表「项目明细」，文本单元格 inlineStr） */
function xlsxRows(rows){
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const xml = s => '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' + s;
  const sh = xml('<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' +
    rows.map((r, ri) => '<row r="' + (ri + 1) + '">' + r.map((c, ci) =>
      '<c r="' + xlColName(ci) + (ri + 1) + '" t="inlineStr"><is><t xml:space="preserve">' + esc(c) + "</t></is></c>").join("") + "</row>").join("") +
    "</sheetData></worksheet>");
  const wb = xml('<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="项目明细" sheetId="1" r:id="rId1"/></sheets></workbook>');
  const ct = xml('<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>');
  const rels = xml('<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  const wbRels = xml('<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>');
  return zipStore([
    ["[Content_Types].xml", ct], ["_rels/.rels", rels],
    ["xl/workbook.xml", wb], ["xl/_rels/workbook.xml.rels", wbRels],
    ["xl/worksheets/sheet1.xml", sh]
  ]);
}
/* 导出当前明细表（所见即所得：含搜索/排序/筛选后的行） */
function exportTableXlsx(){
  const t = document.querySelector("#content table.tbl"); if (!t) return;

  const rows = [...t.querySelectorAll("tbody tr")].map(tr => [...tr.querySelectorAll("td")].map(td => td.textContent.trim()));
  const bytes = xlsxRows([heads, ...rows]);
  const a = document.createElement("a");

  a.download = "战略项目明细_" + new Date().toISOString().slice(0, 10).replace(/-/g, "") + ".xlsx";

}

/* 抽屉里带 data-as 的控件（输入框 / 下拉 / 人名 chips / 文本框）改完就自动存：
   停手 0.9 秒存一次；鼠标点到空白处（失焦）立刻存；关抽屉前也会把没存的补上。 */
let AS_TIMER = null, AS_P = null, AS_HANDLER = null;
function projSnapshot(p){
  return {
    name: p.name, category: p.category, horizon: p.horizon, status: p.status, stage: p.stage,
    owner_label: p.owner_label, counterparty: p.counterparty, contact_label: p.contact_label,
    importance: p.importance, urgency: p.urgency, amount_plan: p.amount_plan, amount_ytd: p.amount_ytd,
    business_relation: p.business_relation, next_action: p.next_action, summary: p.summary,
    other_remark: p.other_remark, landing_month: p.landing_month, updated_at: p.updated_at,
    track: p.track, nav_col: p.nav_col
  };
}
/* 把表单当前值收成一份 patch；soft=true 时周期这类还没填完的字段先跳过，不影响其它字段入库 */
function collectPatch(p, soft){
  if (!$("eName")) return { err: "表单还没画出来" };
  const hzR = resolveHz("eHz", "eHzCustom");
  if (hzR.err && !soft) return { err: hzR.err };
  const land = String($("eLand") ? $("eLand").value || "" : "").trim();
  const patch = {
    name: $("eName").value.trim(),
    category: $("eCat").value.trim(),
    summary: $("sumNew").value.trim(),
    status: $("eSt").value, stage: $("eStage").value,
    owner_label: chipsVal("eOwner"), counterparty: $("eParty").value.trim(),
    contact_label: $("eContact").value.trim(),
    amount_plan: $("eAmt").value === "" ? null : Number($("eAmt").value),
    amount_ytd: $("eYtd").value === "" ? null : Number($("eYtd").value),
    /* 只去掉首尾空白，中间的内容（含换行）原样存，不改写 */
    business_relation: $("eRel").value.trim(),
    next_action: $("eNext").value.trim(),
    other_remark: $("eRemark").value.trim(),
    landing_month: normalizeMonth(land) || null,
    track: $("eTrack") ? $("eTrack").value : p.track,
    nav_col: $("eNav") ? ($("eNav").value || null) : (p.nav_col || null),
    updated_at: new Date().toISOString()
  };
  if (hzR.k) patch.horizon = hzR.k;
  if (!patch.name) return { err: "项目名称不能为空" };
  /* 只写真正变了的那几个字段 */
  const before = projSnapshot(p);
  const diff = {};
  let changed = false;
  Object.keys(patch).forEach(k => {
    const a = before[k] == null ? "" : String(before[k]);
    const b = patch[k] == null ? "" : String(patch[k]);
    if (a !== b) { diff[k] = patch[k]; if (k !== "updated_at") changed = true; }
  });
  return { patch: diff, before, changed };
}
function drawerFlash(msg){
  const el = $("dFlash"); if (!el) return;
  el.textContent = msg; el.classList.remove("hide");
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.classList.add("hide"); el.textContent = ""; }, 1800);
}
async function autosaveNow(p){
  clearTimeout(AS_TIMER); AS_TIMER = null;
  if (!p || !S.openId || S.openId !== p.id) return;
  const r = collectPatch(p, true);
  if (r.err || !r.changed) return;
  const res = await q(cloud.database.from("projects").update(r.patch).eq("id", p.id).select());
  if (res.error) { drawerErr("自动保存失败：" + res.error.message); return; }
  if (!Array.isArray(res.data) || res.data.length === 0) { drawerErr("没有权限修改这条记录，或它已被删除。"); return; }
  pushUndo("自动保存改动", undoProjectPatch(p.id, r.before));
  Object.assign(p, r.patch);   /* 本地同步一份，避免同一处改动被反复提交 */
  /* 16z-2：这里只搬动"下一次更新时间"（黄点按它算），脉络不在这儿写 —— 否则停一次手就多一条 */
  if (r.patch.next_action != null && String(r.patch.next_action).trim()) await touchNextAt(p.id, new Date().toISOString());
  drawerFlash("已自动保存 " + new Date().toTimeString().slice(0, 5));
  render();                    /* 只重绘画布，抽屉不动，输入不被打断 */
}
function bindAutosave(p){
  const host = $("drawerHost"); if (!host) return;
  /* 抽屉会反复重建，监听挂在常驻的 drawerHost 上，换绑时先把上一次的摘掉，避免越攒越多 */
  if (AS_HANDLER) {
    host.removeEventListener("input", AS_HANDLER);
    host.removeEventListener("change", AS_HANDLER);
    host.removeEventListener("focusout", AS_HANDLER);
    AS_HANDLER = null;
  }
  AS_P = p;
  AS_HANDLER = e => {
    const t = e.target;
    if (!t || !t.closest || !t.closest("[data-as]")) return;
    clearTimeout(AS_TIMER);
    if (e.type === "focusout") {
      autosaveNow(p);
      /* 16z-2/16z-3：鼠标点/移到输入框外面 —— 就以这一刻的最后一条为准，记（或更新）成一条脉络；
         刚点过「提交」按钮的这一次失焦不再重复提交 */
      if (t.id === "eNext" && Date.now() - NX_SUBMIT_TS > 800) setTimeout(() => commitNext(p.id), 0);
    }
    else AS_TIMER = setTimeout(() => autosaveNow(p), 900);
  };
  host.addEventListener("input", AS_HANDLER);
  host.addEventListener("change", AS_HANDLER);
  host.addEventListener("focusout", AS_HANDLER);
}
function flushAutosave(){
  if (AS_TIMER) { clearTimeout(AS_TIMER); AS_TIMER = null; if (AS_P) autosaveNow(AS_P); }
}
/* 新增类的文本框（状态 / 协调问题 / 批注）不自动提交，但草稿存本机：
   写到一半点到别处，回来内容还在，不会白写。 */
function draftKey(pid, k){ return "sb_draft_" + pid + "_" + k; }
function bindDrafts(p){
  [["statusNew", "status"], ["coordNew", "coord"], ["noteNew", "note"]].forEach(pair => {
    const id = pair[0], k = pair[1];
    const ta = $(id); if (!ta) return;
    const key = draftKey(p.id, k);
    const saved = STORE.get(key);
    if (saved) ta.value = saved;
    ta.addEventListener("input", () => {
      if (ta.value.trim()) STORE.set(key, ta.value); else STORE.remove(key);
    });
  });
}
function clearDraft(pid, k){ STORE.remove(draftKey(pid, k)); }

    if (!Array.isArray(n.data) || n.data.length === 0) { drawerErr("没有权限写入，请重新登录后重试。"); return; }
    await q(cloud.database.from("projects").update({ updated_at: new Date().toISOString() }).eq("id", p.id));
    clearDraft(p.id, "coord");
    pushUndo("新增协调问题", undoInsertNote(n.data[0].id));
    await refresh(); openDrawer(p.id);
  };
  $("noteSave").onclick = async () => {
    const txt = $("noteNew").value.trim();
    if (!txt) { drawerErr("先写批注内容再添加"); return; }
    const whoTxt = chipsVal("noteWho") || me;
    $("noteSave").disabled = true;
    const n = await q(cloud.database.from("project_notes")
      .insert({ project_id: p.id, kind: "note", content: txt, author: whoTxt }).select());
    $("noteSave").disabled = false;
    if (n.error) { drawerErr("批注保存失败：" + n.error.message); return; }
    if (!Array.isArray(n.data) || n.data.length === 0) { drawerErr("没有权限写入批注，请重新登录后重试。"); return; }
    STORE.set("sb_note_who", whoTxt);
    clearDraft(p.id, "note");
    pushUndo("新增批注", undoInsertNote(n.data[0].id));
    await refresh(); openDrawer(p.id);
  };

  $("dDraft").onclick = async () => {
    const res = await q(cloud.database.from("projects").update({ status: "draft", updated_at: new Date().toISOString() }).eq("id", p.id).select());
    if (res.error) { drawerErr("存草稿失败：" + res.error.message); return; }
    p.status = "draft"; await refresh(); closeDrawer(); drawerFlash("已存入草稿箱");
  };
  const nb = $("nxSubmit");
  if (nb) nb.onclick = async () => {
    nb.disabled = true; nb.textContent = "提交中…";
    try { await submitNext(p.id, true); } finally { nb.disabled = false; nb.textContent = "提交下一步"; }
  };
  $("dSave").onclick = async () => {
    const r = collectPatch(p, false);
    if (r.err) { drawerErr(r.err); return; }
    /* 内容多半已经被自动保存过了，这里不管是刚存上还是早已存好，都直接关抽屉回到看板 */
    if (!r.changed) { await refresh(); closeDrawer(); return; }
    $("dSave").disabled = true;
    const res = await q(cloud.database.from("projects").update(r.patch).eq("id", p.id).select());
    $("dSave").disabled = false;
    if (res.error) { drawerErr("保存失败：" + res.error.message); return; }
    if (!Array.isArray(res.data) || res.data.length === 0) { drawerErr("没有权限修改这条记录，或它已被删除。"); return; }
    pushUndo("保存项目档案", undoProjectPatch(p.id, r.before));
    /* 16x + 16z-2：下一步动作改了 → 记一条脉络；同一会话反复点保存也只更新这一条 */
    await commitNext(p.id);
    await refresh(); closeDrawer();
  };
  $("dDel").onclick = () => deleteProject(p);
  bindHzCustom("eHz", "eHzCustom");
  bindHzDelete(p);
  bindTaResize();
  /* 人名 chips 自己没有 data-as，标在容器上：勾选变化也算改动 */
  const ownerBox = $("eOwner");
  if (ownerBox) ownerBox.dataset.as = "owner_label";
  const landClear = $("eLandClear");
  if (landClear) landClear.onclick = () => { $("eLand").value = ""; autosaveNow(p); drawerFlash("已清空预计落地时间"); };
  const fp = $("filePick"), fi = $("fileInput");
  if (fp && fi) {
    fp.onclick = () => {
      try { fi.click(); }
      catch (e) { diagReport("pick-click-fail", String((e && e.message) || e)); alert("打不开文件选择框，请换用电脑浏览器试试"); }
    };
    fi.onchange = async () => {
      const list = Array.from(fi.files || []);
      fi.value = ""; /* 先清掉，同一个文件才能连着选第二次 */
      if (!list.length) return;
      const tooBig = list.filter(f => (Number(f.size) || 0) > FILE_MAX);
      if (tooBig.length) { alert("这几个文件超过 100 MB，请先压缩或拆分：\n" + tooBig.map(f => f.name).join("\n")); return; }
      await diagReport("upload-start", JSON.stringify({ pid: p.id, files: list.map(f => f.name + "/" + f.size) }));
      fp.disabled = true; fp.textContent = "上传中…";
      const box = $("upBox"); if (box) box.classList.remove("hide");
      renderUploadProgress({ index: 0, count: list.length, name: list[0].name, loaded: 0, size: Number(list[0].size) || 0, speed: 0 });
      let r = { done: [], failed: [] };
      const t0 = Date.now();
      try { r = await uploadFiles(p, list, renderUploadProgress); }
      catch (e) {
        r = { done: [], failed: ["上传过程出错：" + ((e && e.message) || e)] };
        await diagReport("upload-throw", String((e && e.stack) || e));
      }
      await refresh();
      if (S.openId) openDrawer(S.openId);
      /* 抽屉刚被重建过，得重新取按钮；提示也必须放在重建之后，否则会被清掉 */
      const fp2 = $("filePick");
      if (fp2) { fp2.disabled = false; fp2.textContent = "＋ 上传附件"; }
      if (r.failed && r.failed.length) {
        const msg = "这几个没传上去：" + r.failed.join("；");
        drawerErr(msg);
        alert(msg);
      } else if (r.done.length) {
        drawerFlash("已上传 " + r.done.length + " 个附件（用时 " + Math.max(1, Math.round((Date.now() - t0) / 1000)) + " 秒）");
      }
    };
  }  bindAutosave(p);
  bindDrafts(p);
}
/* 删除项目：抽屉里的「删除项目」和看板卡片右下角的「删除」走同一条路，都是先移入回收站 */
async function deleteProject(p){
  if (!p) return;
  if (!confirm("把「" + p.name + "」移入回收站？它的进展 / 状态 / 批注 / 附件都会一起保留，可在顶栏「回收站」里恢复或彻底删除。")) return;
  const r = await q(cloud.database.from("projects").update({ deleted_at: new Date().toISOString() }).eq("id", p.id).select());
  const ok = !r.error && Array.isArray(r.data) && r.data.length > 0;
  if (!ok) {
    /* 云端还没有回收站字段时不能让删除功能整个不能用，退回直接删掉 */
    const d = await q(cloud.database.from("projects").delete().eq("id", p.id));
    if (d.error) { drawerErr("删除失败：" + d.error.message); return; }
    await wipeProjectData(p.id, false);
  }
  await refresh(); closeDrawer();
}
/* 清掉一个项目的附属数据；withFiles 为真时连云端文件一起删 */
async function wipeProjectData(pid, withFiles){
  fixStorageCors();
  /* 回收站里的项目附件不在常驻缓存中，这里现查一次，免得彻底删除后云端留下孤儿文件 */
  const fr = await q(cloud.database.from("project_files").select("path").eq("project_id", pid));
  const paths = ((fr.data || []).map(x => x.path) || []).filter(Boolean);
  if (withFiles && paths.length) await q(cloud.storage.from("runtime").remove(paths));
  await q(cloud.database.from("project_files").delete().eq("project_id", pid));
  await q(cloud.database.from("project_notes").delete().eq("project_id", pid));
  await q(cloud.database.from("project_logs").delete().eq("project_id", pid));
  await q(cloud.database.from("project_nexts").delete().eq("project_id", pid));   /* 16x 下一步脉络一并清理 */
}
function drawerErr(m){
  const el = $("dErr");
  if (!m) { el.classList.add("hide"); return; }
  el.textContent = m; el.classList.remove("hide");
}
function escKey(e){ if (e.key === "Escape") closeDrawer(); }

/* ================= 时间线就地编辑 ================= */
/* 状态 / 协调问题 / 领导批注 / 进展，写过的都能改：点「编辑」就地变成输入框，
   内容、署名（批注人 / 负责人）一起改，保存后时间线上标一个「已编辑 时间」。 */
const TL_META = {
  status: { whoKey: "owner", whoLabel: "署名",   what: "状态记录", table: "project_notes" },
  coord:  { whoKey: "owner", whoLabel: "署名",   what: "协调问题", table: "project_notes" },
  note:   { whoKey: "note",  whoLabel: "批注人", what: "领导批注", table: "project_notes" },
  log:    { whoKey: "owner", whoLabel: "负责人", what: "进展记录", table: "project_logs" }
};
function tlRow(kind, id, pid){
  const src = kind === "log" ? (S.logs[pid] || []) : (S.notes[pid] || []);
  return src.find(x => String(x.id) === String(id)) || null;
}
function openTlEdit(kind, id, pid){
  const meta = TL_META[kind];
  const item = document.querySelector(`[data-tl-item="${kind}-${id}"]`);
  if (!meta || !item) return;
  if (item.querySelector(".tl-edit")) { const t = item.querySelector(".tl-edit-txt"); if (t) t.focus(); return; }
  const row = tlRow(kind, id, pid);
  if (!row) return;
  const whoVal = splitNames(kind === "log" ? row.owner_label : row.author);
  item.querySelectorAll(".tl-body,.tl-who,.tl-act").forEach(x => x.classList.add("hide"));
  const box = document.createElement("div");
  box.className = "tl-edit";
  box.innerHTML =
    `<textarea class="tl-edit-txt">${escapeHtml(row.content || "")}</textarea>
     <div class="lbl">${meta.whoLabel}（可改选，名字后的 × 直接删除，＋ 添加新人名）</div>
     ${chipsHtml("tlEditWho", meta.whoKey, whoVal)}
     <div class="row">
       <button type="button" class="btn primary sm" data-tl-save data-tl-kind="${kind}" data-tl-id="${id}">保存</button>
       <button type="button" class="btn sm" data-tl-cancel>取消</button>
     </div>`;
  item.appendChild(box);
  box.querySelector(".tl-edit-txt").focus();
}
function closeTlEdit(el){
  const item = el.closest(".tl-item");
  if (!item) return;
  item.querySelectorAll(".tl-body,.tl-who,.tl-act").forEach(x => x.classList.remove("hide"));
  const box = item.querySelector(".tl-edit");
  if (box) box.remove();
}

function closeDrawer(){
  /* 关抽屉前把还没存的补上：写完直接关也不会丢 */
  const pid = S.openId, nx = $("eNext");
  const tail = pid && nx && String(nx.value || "").trim() ? String(nx.value).trim() : "";
  flushAutosave();
  /* 16z-2：鼠标移到框外再关抽屉 —— 以最后一条为准，落到同一条脉络上；
     等这条写完再结束会话，否则会当作新会话再插一条 */
  if (tail) recordNext(pid, tail).then(endNextDraft, endNextDraft);
  else endNextDraft();
  AS_P = null;
  $("drawerHost").innerHTML = "";
  S.openId = null;
  document.removeEventListener("keydown", escKey);
}

/* 周期叫法各公司不一样，所以把「短期/中期/长期」做成可改名的配置，还能加自定义周期（比如"战略储备"） */
$("btnHzSet").onclick = () => {
  let list = hzList();
  const isBuiltin = k => HZ_BUILTIN_KEYS.indexOf(k) >= 0;
  const rowsHtml = () => list.map((x, i) => `<div class="hzrow">
    <input class="field" value="${escapeHtml(x.n)}" data-hz-n="${i}" placeholder="周期名称">
    <input class="field" value="${escapeHtml(x.d || "")}" data-hz-d="${i}" placeholder="副标题，可留空" style="max-width:160px">
    ${isBuiltin(x.k)
      ? `<span style="font-size:12px;color:var(--text-3);flex:none">内置</span>`
      : `<button type="button" class="btn sm danger" data-hz-del="${i}">删除</button>`}
  </div>`).join("");
  /* 输入框改了名还没保存就点「新增」时，先把编辑中的值收回 list，否则重绘会把改动冲掉 */
  const syncInputs = () => {
    const box = $("hzRows"); if (!box) return;
    box.querySelectorAll("[data-hz-n]").forEach(inp => {
      const i = Number(inp.dataset.hzN);
      if (!list[i]) return;
      if (inp.value.trim()) list[i].n = inp.value.trim();
      const dEl = box.querySelector(`[data-hz-d="${i}"]`);
      if (dEl) list[i].d = dEl.value.trim();
    });
  };
  const paint = () => { $("hzRows").innerHTML = rowsHtml(); bindDel(); };
  const bindDel = () => {
    $("hzRows").querySelectorAll("[data-hz-del]").forEach(b => {
      b.onclick = async () => {
        syncInputs();
        const i = Number(b.dataset.hzDel);
        const item = list[i]; if (!item) return;
        const ids = S.projects.filter(p => p.horizon === item.k).map(p => p.id);
        if (!confirm(`删除周期「${item.n}」？${ids.length ? `有 ${ids.length} 个项目正在用它，会一并改到「${hzName("short")}」。` : ""}`)) return;
        if (ids.length) await q(cloud.database.from("projects").update({ horizon: "short" }).in("id", ids).select());
        list.splice(i, 1); hzSave(list);
        if (S.horizon === item.k) S.horizon = "";
        pushUndo(`删除周期「${item.n}」`, async () => {
          const l = hzList(); l.push(item); hzSave(l); paintHzFilter();
          if (ids.length) await q(cloud.database.from("projects").update({ horizon: item.k }).in("id", ids));
          await refresh(); paint();
        });
        await refresh(); paintHzFilter(); paint();
      };
    });
  };
  document.removeEventListener("keydown", escKey);
  $("drawerHost").innerHTML = `<div class="mask" id="mask"><div class="drawer">
    <header><h2>周期设置</h2><button class="xbtn" id="dClose">×</button></header>
    <div class="body">
      <div class="okbox">改名只影响你自己看到的叫法；项目上存的是周期编号，别人看到的仍是他们自己的叫法。</div>
      <div id="hzRows">${rowsHtml()}</div>
      <div class="row">
        <button class="btn sm" id="hzAdd">+ 新增周期</button>
        <button class="btn sm" id="hzReset">恢复默认</button>
      </div>
      <div class="sect">说明</div>
      <div style="font-size:12.5px;color:var(--text-2);line-height:1.7">
        内置的三项（短期 / 中期 / 长期）只能改名，不能删，避免看板缺一块。<br>
        自定义周期可以随便加、随便删；删掉时挂在它下面的项目会自动落到「${escapeHtml(hzName("short"))}」，不会丢。
      </div>
      <button class="btn primary" id="hzSave" style="width:100%;margin-top:16px">保存</button>
    </div></div></div>`;
  $("dClose").onclick = closeDrawer;
  $("mask").onclick = (e) => { if (e.target.id === "mask") closeDrawer(); };
  document.addEventListener("keydown", escKey);
  bindDel();
  $("hzAdd").onclick = () => {
    syncInputs();
    const n = (prompt("新周期叫什么？例：战略储备 / 已立项") || "").trim();
    if (!n) return;
    list.push({ k: "c" + Date.now().toString(36), n, d: "" });
    paint();
  };
  $("hzReset").onclick = () => {
    if (!confirm("恢复成默认的 短期 / 中期 / 长期？自定义周期会全部删除。")) return;
    list = HZ_BUILTIN.map(x => ({ ...x }));
    hzSave(list); paintHzFilter(); paint(); render();
  };
  $("hzSave").onclick = () => {
    const next = [];
    $("hzRows").querySelectorAll("[data-hz-n]").forEach(inp => {
      const i = Number(inp.dataset.hzN);
      const d = $("hzRows").querySelector(`[data-hz-d="${i}"]`);
      const nm = inp.value.trim();
      if (!nm) return;
      next.push({ k: list[i].k, n: nm, d: d ? d.value.trim() : "" });
    });
    if (!next.length) { alert("至少要保留一个周期"); return; }
    list = next; hzSave(list); paintHzFilter(); render(); closeDrawer();
  };
};
