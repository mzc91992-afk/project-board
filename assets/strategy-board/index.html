/* 时间线编辑：编辑 / 取消 / 保存。抽屉会重建，所以一律挂在 document 上 */
document.addEventListener("click", async e => {
  const pid = S.openId; if (!pid) return;
  /* ✅实质性推进开关：在每条状态动态的「编辑/删除」行上，点一下切换，写云端 subst */
  const stg = e.target.closest("[data-subst-toggle]");
  if (stg) {
    const nid = Number(stg.dataset.substToggle);
    let note = null;
    Object.keys(S.notes).some(k => (S.notes[k] || []).some(n => { if (n.id === nid) note = n; return !!note; }));
    if (!note) return;
    const nv = !note.subst;
    const r = await q(cloud.database.from("project_notes").update({ subst: nv }).eq("id", nid).select());
    if (r.error) { drawerErr("切换失败：" + r.error.message); return; }
    note.subst = nv;
    await refresh(); openDrawer(pid);   /* 重建抽屉与导航统计 */
    return;
  }
  const ed = e.target.closest("[data-tl-edit]");
  if (ed) { openTlEdit(ed.dataset.tlEdit, Number(ed.dataset.tlId), pid); return; }
  const cancel = e.target.closest("[data-tl-cancel]");
  if (cancel) { closeTlEdit(cancel); return; }
  const saveBtn = e.target.closest("[data-tl-save]");
  if (!saveBtn) return;
  const kind = saveBtn.dataset.tlKind, id = Number(saveBtn.dataset.tlId);
  const meta = TL_META[kind];
  const row = tlRow(kind, id, pid);
  if (!meta || !row) return;
  const item = saveBtn.closest(".tl-item");
  const txt = (item.querySelector(".tl-edit-txt").value || "").trim();
  if (!txt) { drawerErr("内容不能为空"); return; }
  const who = chipsVal("tlEditWho") || (kind === "log" ? "" : meName());
  const now = new Date().toISOString();
  saveBtn.disabled = true; saveBtn.textContent = "保存中…";
  let r;
  if (kind === "log") {
    const before = { content: row.content || "", owner_label: row.owner_label || "" };
    r = await q(cloud.database.from("project_logs").update({ content: txt, owner_label: who, updated_at: now }).eq("id", id).select());
    /* 老表可能没有 updated_at 这一列，退一步不写时间也要把内容存下来 */
    if (r.error) r = await q(cloud.database.from("project_logs").update({ content: txt, owner_label: who }).eq("id", id).select());
    saveBtn.disabled = false; saveBtn.textContent = "保存";
    if (r.error) { drawerErr("保存失败：" + r.error.message); return; }
    if (!Array.isArray(r.data) || r.data.length === 0) { drawerErr("没有权限修改这条记录，或它已被删除。"); return; }
    pushUndo("修改" + meta.what, async () => {
      await q(cloud.database.from("project_logs").update(before).eq("id", id));
      await afterUndo();
    });
  } else {
    const before = { content: row.content || "", author: row.author || "", updated_at: row.updated_at || null };
    r = await q(cloud.database.from("project_notes").update({ content: txt, author: who, updated_at: now }).eq("id", id).select());
    saveBtn.disabled = false; saveBtn.textContent = "保存";
    if (r.error) { drawerErr("保存失败：" + r.error.message); return; }
    if (!Array.isArray(r.data) || r.data.length === 0) { drawerErr("没有权限修改这条记录，或它已被删除。"); return; }
    pushUndo("修改" + meta.what, async () => {
      await q(cloud.database.from("project_notes").update(before).eq("id", id));
      await afterUndo();
    });
  }
  await refresh(); openDrawer(pid);
});

document.addEventListener("click", async e => {

  if (delSt) {
    const id = Number(delSt.dataset.statusDel);
    const row = (S.notes[pid] || []).find(n => String(n.id) === String(id));
    if (!confirm("删除这条状态记录？删除后不可恢复。")) return;
    const r = await q(cloud.database.from("project_notes").delete().eq("id", id).select());
    if (r.error) { drawerErr("删除失败：" + r.error.message); return; }
    if (row) pushUndo("删除状态记录", undoDeleteNote(row));
    await refresh(); openDrawer(pid); return;
  }
  if (togC) {
    const it = (S.notes[pid] || []).find(n => String(n.id) === String(togC.dataset.coordToggle));
    if (!it) return;
    /* 切换 √/× 时把修改时间一起更新，列表里显示的时间始终是最新改动时间 */
    const before = { resolved: it.resolved, updated_at: it.updated_at };
    const r = await q(cloud.database.from("project_notes")
      .update({ resolved: !it.resolved, updated_at: new Date().toISOString() }).eq("id", it.id).select());
    if (r.error) { drawerErr("切换失败：" + r.error.message); return; }
    if (!Array.isArray(r.data) || r.data.length === 0) { drawerErr("没有权限修改，或记录已被删除。"); return; }
    pushUndo(before.resolved ? "取消已协调" : "标记已协调", async () => {
      await q(cloud.database.from("project_notes").update(before).eq("id", it.id));
      await afterUndo();
    });
    await refresh(); openDrawer(pid); return;
  }
  if (delC) {
    const id = Number(delC.dataset.coordDel);
    const row = (S.notes[pid] || []).find(n => String(n.id) === String(id));
    if (!confirm("删除这条协调问题？删除后不可恢复。")) return;
    const r = await q(cloud.database.from("project_notes").delete().eq("id", id).select());
    if (r.error) { drawerErr("删除失败：" + r.error.message); return; }
    if (row) pushUndo("删除协调问题", undoDeleteNote(row));
    await refresh(); openDrawer(pid); return;
  }
  if (delN) {
    const id = Number(delN.dataset.noteDel);

    if (!confirm("删除这条领导批注？删除后不可恢复。")) return;
    const r = await q(cloud.database.from("project_notes").delete().eq("id", id).select());
    if (r.error) { drawerErr("删除失败：" + r.error.message); return; }
    if (row) pushUndo("删除批注", undoDeleteNote(row));
    await refresh(); openDrawer(pid); return;
  }
  /* 进展时间线：写错了或重复的可以删掉，项目的「最近更新」时间不受影响 */
  const delL = e.target.closest("[data-log-del]");

    if (!confirm("删除这条进展记录？删除后不可恢复。")) return;
    const r = await q(cloud.database.from("project_logs").delete().eq("id", id).select());
    if (r.error) { drawerErr("删除失败：" + r.error.message); return; }
    if (!Array.isArray(r.data) || r.data.length === 0) { drawerErr("没有权限删除这条记录，或它已被删除。"); return; }
    if (row) pushUndo("删除进展记录", undoDeleteLog(row));
    await refresh(); openDrawer(pid); return;

  if (S.openId != null) return S.openId;
  const host = $("nxBoxHost");
  return host && host.dataset.nxpid ? host.dataset.nxpid : S.detailId;
}
async function nxRedraw(raw){
  /* 脉络容器的 id 是字符串，openDrawer 里用严格比较取值，这里统一换成项目真实 id */
  const real = S.projects.find(x => String(x.id) === String(raw));
  const pid = real ? real.id : raw;
  if (S.openId != null) { NEXT_KEEP = true; openDrawer(pid); return; }
  if (S.detailId != null) { openDetail(pid); return; }
  render();
}
document.addEventListener("click", async e => {
  const nxEdit = e.target.closest("[data-nledit]");
  if (nxEdit) {
    const pid = nxPid(); if (!pid) return;
    const id = nxEdit.dataset.nledit;
    const item = nxEdit.closest(".nl-item");
    const box = item && item.querySelector(".nl-txt");
    const it = (S.nexts[pid] || []).find(x => String(x.id) === String(id));
    if (!box || !it || box.querySelector("textarea")) return;
    box.innerHTML = '<textarea class="nl-edit" style="width:100%;min-height:54px">' + escapeHtml(it.content) + '</textarea>' +
      '<div class="nl-btns"><button type="button" class="btn primary sm" data-nlsave="' + id + '">保存</button>' +
      '<button type="button" class="btn sm" data-nlcancel="' + id + '">取消</button></div>';
    return;
  }
  const nxCancel = e.target.closest("[data-nlcancel]");
  if (nxCancel) { const pid = nxPid(); if (pid) nxRedraw(pid); return; }
  const nxSave = e.target.closest("[data-nlsave]");
  if (nxSave) {
    const pid = nxPid(); if (!pid) return;
    const id = nxSave.dataset.nlsave;
    const ta = nxSave.closest(".nl-item").querySelector("textarea");
    const it = (S.nexts[pid] || []).find(x => String(x.id) === String(id));
    const txt = ta ? ta.value.trim() : "";
    if (!it || !txt) { drawerErr("内容不能为空"); return; }
    if (txt === String(it.content || "").trim()) { nxRedraw(pid); return; }   /* 没改动就不折腾网络 */
    nxSave.disabled = true; nxSave.textContent = "保存中…";
    const now = new Date().toISOString();
    /* 改动内容不改「提交时间」：那条时间仍是当初提交的时刻，另记一个「已编辑」时间 */
    let r = await q(cloud.database.from("project_nexts").update({ content: txt, updated_at: now }).eq("id", id).select());
    if (r.error) r = await q(cloud.database.from("project_nexts").update({ content: txt }).eq("id", id).select());  /* 老表没有 updated_at 也能存下来 */
    nxSave.disabled = false; nxSave.textContent = "保存";
    if (r.error) { drawerErr("保存失败：" + r.error.message); return; }
    if (!Array.isArray(r.data) || r.data.length === 0) { drawerErr("没有权限修改这条记录，或它已被删除。"); return; }
    pushUndo("修改下一步脉络", async () => {
      await q(cloud.database.from("project_nexts").update({ content: it.content, updated_at: it.updated_at || null }).eq("id", id));
      await refresh();
      await nxRedraw(pid);
    });
    /* 改了脉络也算「下一步动过」，黄点跟着更新 */
    it.content = txt; it.updated_at = now;
    await touchNextAt(pid, now);
    await refresh(); await nxRedraw(pid); return;
  }
  const nxDel = e.target.closest("[data-nldel]");
  if (nxDel) {
    const pid = nxPid(); if (!pid) return;
    const id = nxDel.dataset.nldel;
    const it = (S.nexts[pid] || []).find(x => String(x.id) === String(id));
    if (!confirm("删除这条下一步线索？删除后不可恢复。")) return;
    const r = await q(cloud.database.from("project_nexts").delete().eq("id", id).select());
    if (r.error) { drawerErr("删除失败：" + r.error.message); return; }
    if (it) pushUndo("删除下一步线索", async () => {
      await q(cloud.database.from("project_nexts").insert({ project_id: it.project_id, content: it.content, created_at: it.created_at }));
      await refresh();
      await nxRedraw(pid);
    });
    /* 脉络删空了，项目就不再按「下一步更新」打黄点 */
    if (NEXT_DRAFT && String(NEXT_DRAFT.id) === String(id)) endNextDraft();   /* 删掉的正是本次草稿，别再去更新它 */
    if (NEXT_LAST && String(NEXT_LAST.id) === String(id)) NEXT_LAST = null;
    /* 本地也同步去掉这一条：万一云端读得慢/失败，界面不会还留着一条已删的 */
    const left = (S.nexts[pid] || []).filter(x => String(x.id) !== String(id));
    S.nexts[pid] = left;
    if (!left.length) {
      const p = S.projects.find(x => String(x.id) === String(pid));
      if (p) p.next_action_at = null;
      await q(cloud.database.from("projects").update({ next_action_at: null }).eq("id", pid));
    }
    await refresh(); await nxRedraw(pid); return;
  }
});

/* ================= 回收站 ================= */
function paintTrashBtn(){
  const b = $("btnTrash"); if (!b) return;
  const n = (S.trash || []).length;
  b.textContent = n ? "回收站 " + n : "回收站";
}
function fmtDT(iso){
  if (!iso) return "—";
  return fmtDate(iso) + " " + new Date(iso).toTimeString().slice(0, 5);
}
function openTrash(){
  const host = $("trashHost"); if (!host) return;
  const list = (S.trash || []).slice().sort((a, b) => new Date(b.deleted_at || 0) - new Date(a.deleted_at || 0));
  const rows = list.length ? list.map(p => `<div class="titem">
      <div class="tn"><b>${escapeHtml(p.name)}</b>
        <span>${escapeHtml(hzName(p.horizon))} · ${escapeHtml(p.stage || "未分类")} · 删除于 ${fmtDT(p.deleted_at)}</span></div>
      <button class="btn sm" data-tr="restore" data-id="${p.id}">恢复</button>
      <button class="btn sm danger" data-tr="purge" data-id="${p.id}">彻底删除</button>
    </div>`).join("") : `<div class="empty" style="padding:26px"><p>回收站是空的</p></div>`;
  host.innerHTML = `<div class="mask" id="trMask" style="justify-content:center;align-items:center"><div class="tbox">
    <div class="thead"><b>回收站 · ${list.length} 个</b><button class="xbtn" id="trClose">×</button></div>
    <div class="tbody">${rows}</div>
    ${list.length ? `<div class="tfoot"><span style="flex:1;font-size:11.5px;color:var(--text-3)">彻底删除会连进展 / 状态 / 批注 / 附件一起清掉，无法恢复</span>
      <button class="btn sm danger" id="trClear">清空回收站</button></div>` : ""}
  </div></div>`;
  $("trClose").onclick = closeTrash;
  $("trMask").onclick = e => { if (e.target.id === "trMask") closeTrash(); };
  const cl = $("trClear"); if (cl) cl.onclick = clearTrash;
  host.querySelectorAll("[data-tr]").forEach(btn => {
    btn.onclick = async () => {
      const p = (S.trash || []).find(x => String(x.id) === String(btn.dataset.id));
      if (!p) return;
      if (btn.dataset.tr === "restore") await restoreProject(p); else await purgeProject(p);
    };
  });
}
function closeTrash(){ const host = $("trashHost"); if (host) host.innerHTML = ""; }
async function restoreProject(p){
  const r = await q(cloud.database.from("projects").update({ deleted_at: null }).eq("id", p.id).select());
  if (r.error) { alert("恢复失败：" + r.error.message); return; }
  await refresh(); openTrash();
}
async function purgeProject(p){
  if (!confirm("彻底删除「" + p.name + "」？进展 / 状态 / 批注 / 附件会一起清掉，无法恢复。")) return;
  await wipeProjectData(p.id, true);
  const r = await q(cloud.database.from("projects").delete().eq("id", p.id));
  if (r.error) { alert("删除失败：" + r.error.message); return; }
  await refresh(); openTrash();
}
async function clearTrash(){
  const list = (S.trash || []).slice();
  if (!list.length) return;
  if (!confirm("清空回收站？" + list.length + " 个项目及其全部记录都会被彻底删除，无法恢复。")) return;
  for (const p of list) {
    await wipeProjectData(p.id, true);
    await q(cloud.database.from("projects").delete().eq("id", p.id));
  }
  await refresh(); openTrash();
}

/* 诊断：一次点击把现场（版本 / URL / 浏览器 / 最近几次登录过程）复制到剪贴板 */
$("btnDiag").onclick = async () => {
  const txt = diagText();
  const tip = $("diagTip");
  try {
    if (navigator.clipboard) await navigator.clipboard.writeText(txt);
    else throw new Error("no clipboard");
    tip.textContent = "已复制，粘贴发给开发者即可";
  } catch (e) {
    /* 没有剪贴板权限时退回到选中文本提示 */
    tip.textContent = "复制失败，请截图此页";
    console.log(txt);
  }
  setTimeout(() => { if (tip) tip.textContent = ""; }, 6000);
};

/* 清掉本机所有登录凭据与令牌（主题、拖动锁、KPI 宽度等偏好不动），返回清掉的键名 */
function purgeAuthStorage(){
  const drop = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = String(localStorage.key(i) || "");
      /* 只清登录凭据和 token，保留邮箱（下次好登）与主题等偏好。
         注意真实键名是 sb_login_pwd / sb_login_exp，别写成 sb_pwd 导致清不掉 */
      if (/wbpk|_pwd|_exp|token|session|auth|jwt/i.test(k)) drop.push(k);
    }
    drop.forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
  } catch (e) {}
  try { sessionStorage.clear(); } catch (e) {}
  return drop;
}

/* 救援按钮：登录态坏掉时一键清掉本机登录记录（主题、拖动锁、KPI 宽度等偏好不动） */
$("btnResetLogin").onclick = async () => {
  const drop = purgeAuthStorage();
  const tip = $("diagTip");
  if (tip) tip.textContent = "已清除 " + drop.length + " 项本机登录记录，正在重新加载…";
  setTimeout(() => location.reload(), 900);
};

window.addEventListener("error", e => {
  const m = String(e.message || e.error).slice(0, 200);
  diagLog({ stage: "jserror", msg: m });
  try { diagPush("jserror", m + " | v=" + APP_VERSION); } catch (x) {}
  showFatal(e.message || String(e.error));
});
window.addEventListener("unhandledrejection", e => {
  const m = (e.reason && e.reason.message) || String(e.reason);
  diagLog({ stage: "rejection", msg: String(m).slice(0, 200) });
  try { diagPush("rejection", String(m).slice(0, 200) + " | v=" + APP_VERSION); } catch (x) {}
  showFatal(m);
});

boot().catch(err => {
  diagLog({ stage: "bootfail", msg: String((err && err.message) || err).slice(0, 200) });
  showFatal((err && err.message) || String(err));
});
